售总览](https://zhoujinq.github.io/customer-commitment-ledger/#overview)\n- [客户档案](https://zhoujinq.github.io/customer-commitment-ledger/#customers)\n- [跟进待办](https://zhoujinq.github.io/customer-commitment-ledger/#actions)\n- [沟通记录](https://zhoujinq.github.io/customer-commitment-ledger/#touchpoints)\n- [会议素材](https://zhoujinq.github.io/customer-commitment-ledger/#meetings)\n- [自动化说明](https://zhoujinq.github.io/customer-commitment-ledger/#automation)\n- [项目说明](https://zhoujinq.github.io/customer-commitment-ledger/#docs)\n\n> 在线页面与仓库中的 `index.html` 使用同一套静态代码。页面展示固定日期的虚构客户快照，不读取真实客户数据，不发送消息，也不执行自动化任务。\n\n## 为什么做这个项目\n\n客户跟进的信息往往散落在邮件、会议纪要、聊天记录和个人待办中：\n\n- 客户处于哪个阶段，要靠翻记录还原；\n- 最近一次沟通是什么，缺少统一时间线；\n- 下一步做什么、什么时候到期，容易漏掉；\n- 为什么留下这项待办，找不到原始出处；\n- 每周复盘时，难以同时看清推进、逾期与素材积压。\n\n本系统把这些碎片整理为可管理的数据行：**客户是谁、处于什么阶段、最近沟通了什么、下一步由谁跟进、依据在哪里。**\n\n一句话概括：\n\n> **邮件和会议进来，客户状态和下一步行动出去。**\n\n## 核心业务闭环\n\n| 环节 | 要解决的问题 | 系统做法 |\n| --- | --- | --- |\n| 捕捉 | 原始素材散落 | 新邮件形成触点记录，会议转写形成会议记录 |\n| 整理 | 客户状态难以还原 | 将客户、会议和触点按统一身份归档 |\n| 跟进 | 到期与逾期缺少提醒 | 从素材中整理待办，保留期限、责任方和出处 |\n| 复盘 | 推进与积压不可见 | 每周汇总事项变动、逾期、积压和完成情况 |\n\n### 三条无人值守硬规则\n\n1. **机器只写机器字段**：今日分、最后触点日、触点和会议行可以由自动化写入；卡点、优先级、阶段和客户归属只能由人确认。\n2. **不自动确认待裁决项**：自动抽取结果必须经人工确认，不能把模型草案直接当作事实。\n3. **失败即停，重试不超过 2 次**：避免无人值守任务无限重试、刷屏或放大异常。\n\n## 工作台功能\n\n工作台包含七个完整视图，可通过顶部导航、终端命令或 URL hash 切换。\n\n| 视图 | 主要内容 | 交互能力 |\n| --- | --- | --- |\n| 销售总览 | 客户、待办、会议与触点快照 | 查看优先事项、销售流水线、客户阶段与数据健康 |\n| 客户档案 | 6 家虚构客户的优先级、阶段、类型、最近触点与待办 | 搜索客户，按优先级或阶段筛选，展开别名与卡点 |\n| 跟进待办 | 8 条行动及其期限、状态、责任方与出处 | 搜索，按待办、逾期、无期限、已办筛选，展开出处 |\n| 沟通记录 | 17 条邮件触点及客户归属状态 | 搜索主题或备注，按客户与来源筛选 |\n| 会议素材 | 47 场会议的日期、归属与整理状态 | 搜索标题，按客户与状态筛选 |\n| 自动化 | A2、A3、A4 三个核心自动化配置 | 查看触发方式、处理逻辑、运行边界和已知缺口 |\n| 项目说明 | 项目原理、功能、数据边界、维护方式与路线图 | 阅读本 README，下载 Markdown，访问仓库 |\n\n### 阅读与显示设置\n\n点击页面底部的 **“显示设置”**，可以：\n\n- 开启或关闭方格纸背景；\n- 切换标准或紧凑行密度；\n- 恢复默认显示。\n\n页面提供跳到主要内容的链接、清晰键盘焦点、当前视图标识、减少动态效果支持，以及窄屏导航和表格滚动。\n\n## 终端与快捷操作\n\n首屏终端不是装饰。点击输入框后可以使用：\n\n| 命令 | 中文别名 | 行为 |\n| --- | --- | --- |\n| `help` | `帮助` | 查看全部命令 |\n| `today` | `今天` | 打开跟进待办并筛出全部待办 |\n| `overdue` | `逾期` | 打开跟进待办并筛出逾期事项 |\n| `clients` | `客户` | 打开客户档案 |\n| `meetings` | `会议` | 打开会议素材 |\n| `docs` | `文档` | 打开项目说明 |\n| `clear` | `清屏` | 清空终端输出 |\n\n终端支持方向上、下键翻阅历史命令，也支持 `Ctrl / Cmd + L` 清屏。\n\n## 当前演示快照\n\n数据日期：**2026-11-18**。\n\n| 指标 | 数量 | 说明 |\n| --- | ---: | --- |\n| 客户 | 6 | 客户A–F，全部为虚构代号 |\n| 跟进事项 | 8 | 5 条待办，其中 2 条逾期、3 条无期限；另有 3 条已办 |\n| 会议 | 47 | 38 场未归属，主整理阶段尚未建设 |\n| 邮件触点 | 17 | 7 条已归属、10 条未归属 |\n| 数据表 | 4 | 客户、行动、会议、触点 |\n| 业务视图 | 8 | 今天、风险雷达、客户全景及 5 个异常视图 |\n| 核心自动化配置 | 3 | A2 邮件触点、A3 每日跟进提醒、A4 周复盘 |\n\n这些数字用于呈现系统业务结构与管理口径；身份、联系方式、单号和外部资源标识均不公开。\n\n## 自动化设计\n\n> 本仓库展示自动化的产品设计与静态配置，不包含真实定时任务、消息发送能力或生产环境脚本。\n\n| 配置 | 触发方式 | 处理逻辑 | 输出 |\n| --- | --- | --- | --- |\n| A2 新邮件触点落表 | 收到新邮件 | 依次按关键人邮箱、邮箱域名匹配；无法识别则进入未归属；以来源 ID 幂等 | 触点记录、最后触点日 |\n| A3 每日跟进提醒 | 每天 08:30 | 计算今日分，按逾期与真实约定排序；同一客户在 Top 2 中最多占一条 | 每日优先事项及数据健康指标 |\n| A4 周复盘 | 每周六 14:30 | 只读汇总本周事项变动、逾期 Top 3、素材积压和完成情况 | 每周复盘摘要 |\n\n### 今日分\n\n公开快照采用的排序口径为：\n\n```text\n今日分 = 逾期天数 × 3 + 真实约定加权 15\n```\n\n今日分只用于确定提醒顺序，不替代人工判断，也不表示客户价值。\n\n## 数据结构\n\n### 四张核心表\n\n| 数据表 | 关键字段 | 作用 |\n| --- | --- | --- |\n| 客户 | 客户名、别名、优先级、阶段、卡点、关键人、最后触点日、归属 | 待办与触点的归集对象 |\n| 行动 | 内容、客户、状态、期限、期限性质、来源、责任方、阻塞项、出处、今日分 | 跟进事项的最小管理单元 |\n| 会议 | 标题、会议标识、日期、客户、整理状态、摘要 | 行动整理的上游素材 |\n| 触点 | 主题、客户、日期、来源、来源 ID、备注 | 证明客户近期往来的轻量流水 |\n\n### 八个业务视图\n\n- 今天：待办且今日分非空，按今日分降序；\n- 风险雷达：待办且期限早于今天，按期限升序；\n- 客户全景：按 P0 → P2 分组；\n- 异常·卡点为空；\n- 异常·已废无原因；\n- 异常·期限缺失；\n- 异常·会议未归属；\n- 异常·触点未归属。\n\n## 本地运行\n\n### 方式一：直接打开\n\n1. 下载或克隆仓库：\n\n   ```bash\n   git clone https://github.com/zhoujinq/customer-commitment-ledger.git\n   ```\n\n2. 进入项目目录，使用浏览器打开 `index.html`。\n\n不需要执行 `npm install`，也不需要构建工具、账号或 API Key。运行所需字体和业务代码均在本地，直接打开即可离线浏览。\n\n### 方式二：本地静态服务器\n\n如果希望通过 HTTP 访问，可在项目目录执行：\n\n```bash\npython -m http.server 8000\n```\n\n然后访问 `http://localhost:8000/`。\n\n### GitHub Pages\n\n本项目适合直接使用 GitHub Pages 发布仓库根目录：\n\n1. 打开仓库的 **Settings → Pages**；\n2. 选择从分支部署；\n3. 选择主分支与 `/(root)`；\n4. 保存后访问本 README 顶部的在线预览地址。\n\n## 技术实现\n\n- **单文件应用**：页面结构、样式、原生 JavaScript、业务数据和公开项目说明均包含在 `index.html` 中；\n- **无框架、无构建依赖**：不需要 React、Node.js、包管理器或编译步骤；\n- **本地字体**：Maple Mono 与 Noto Sans SC 随仓库提供，不依赖外部字体 CDN；\n- **数据入口集中**：演示快照位于 `window.CRM_DATA`，公开项目说明位于 `window.PROJECT_README`；\n- **可分享导航**：七个视图支持 URL hash 深链接，以及浏览器前进、后退；\n- **响应式布局**：宽表格只在自身容器内滚动，不撑破页面；\n- **离线可用**：页面没有真实数据请求，也没有外部服务依赖；\n- **可编辑介绍卡片**：`assets/project-card.html` 是卡片源文件，`assets/project-card.png` 是 README 使用的同尺寸导出图。\n\n## 项目结构\n\n```text\nproject/\n├── index.html                 # 交互式工作台主文件\n├── README.md                  # 完整项目说明\n└── assets/\n    ├── project-card.html      # 1280×640 项目介绍卡片源文件\n    ├── project-card.png       # 项目介绍卡片导出图\n    └── fonts/\n        ├── maple-regular.woff2\n        ├── maple-bold.woff2\n        ├── noto-sans-sc-*.woff2\n        └── LICENSE-*.txt      # 字体许可证\n```\n\n## 数据与隐私边界\n\n公开仓库遵循以下边界：\n\n- 客户仅使用客户A–F等虚构代号，联系人也使用代号；\n- 不包含内部人员姓名、内部邮箱、手机号、真实客户名或真实客户别名；\n- 不包含内部平台链接、数据底座地址、资源 token、物流单号或 SN 码；\n- Astribot、T1、S1 等公开产品线信息可以保留；\n- 数量、日期、逾期天数等快照口径可以保留，但不能据此反推出真实身份；\n- 页面不连接真实数据底座，不发送消息，不运行真实自动化；\n- 真实系统与公开演示分叉维护，不进行自动同步。\n\n**请勿通过 Issue、Pull Request、提交记录或附件向仓库补充任何真实业务数据。**\n\n## 维护与更新\n\n从真实系统更新公开快照时，建议按以下顺序操作：\n\n1. 从真实系统导出最新快照；\n2. 在公开仓库之外完成身份替换与资源标识清理；\n3. 替换 `index.html` 中的 `window.CRM_DATA`；\n4. 同步更新 `README.md` 与页面内的 `window.PROJECT_README`；\n5. 检查客户、行动、会议和触点数量是否一致；\n6. 扫描真实客户名、内部人名、邮箱、手机号、单号、token 和内部平台链接；\n7. 检查所有本地字体与资源引用；\n8. 在浏览器验证七个视图、终端命令、搜索筛选、详情展开、文档下载和移动布局；\n9. 确认公开仓库、提交说明、README 和介绍卡片均不含敏感信息后再发布。\n\n新增文案时，如果希望继续保持一致的字体表现，应同时检查字体子集的字符覆盖；必要时重新生成对应 WOFF2 文件。\n\n## 后续路线\n\n真实系统与公开演示可以共享产品思路，但分别维护。后续建设重点包括：\n\n1. **会议整理主阶段**：从会议素材生成行动草案与待裁决卡，人工确认后进入跟进待办；\n2. **聚合与公式能力**：补充完成率、沉默天数等指标，并完善降级写入策略；\n3. **历史数据回填**：在明确授权后补齐客户历史最后触点日；\n4. **异常治理能力**：继续完善期限缺失、未归属、卡点为空和已废无原因等异常视图；\n5. **公开演示体验**：在不引入真实业务数据的前提下，持续改进可访问性、交互和说明文档。\n\n## 字体许可\n\n项目运行使用以下字体，并保留对应许可证：\n\n- Maple Mono；\n- Noto Sans SC。\n\n上述字体均按 **SIL Open Font License 1.1** 使用，许可证位于 [`assets/fonts/`](assets/fonts/)。\n";</script>
<script>
(() => {
  "use strict";
  const D = window.CRM_DATA;
  const README = window.PROJECT_README;
  const PRODUCT = "销售助手-客户管理系统";
  const VIEWS = [
    {id:"overview",label:"销售总览",color:"#3350e6",desc:"客户、待办、沟通和素材的当前快照。"},
    {id:"customers",label:"客户档案",color:"#2f7d4f",desc:"按优先级与阶段查看客户，并展开别名、卡点和关联待办。"},
    {id:"actions",label:"跟进待办",color:"#b06219",desc:"每条行动都有状态、期限、责任边界和可展开的出处。"},
    {id:"touchpoints",label:"沟通记录",color:"#3350e6",desc:"邮件触点按客户归集，未归属记录单独可见。"},
    {id:"meetings",label:"会议素材",color:"#2b2418",desc:"搜索会议标题，检查客户归属与整理状态。"},
    {id:"automation",label:"自动化",color:"#2f7d4f",desc:"这里展示静态配置与运行边界，不执行真实任务。"},
    {id:"docs",label:"项目说明",color:"#3350e6",desc:"完整阅读项目说明，或下载 README.md。"}
  ];
  const state = {
    view:"overview",
    customers:{q:"",priority:"",stage:""},
    actions:{q:"",status:"",customer:""},
    touchpoints:{q:"",customer:"",source:""},
    meetings:{q:"",customer:"",status:""}
  };
  const $ = (selector,root=document) => root.querySelector(selector);
  const $$ = (selector,root=document) => [...root.querySelectorAll(selector)];
  const esc = value => String(value ?? "").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  const list = value => Array.isArray(value) ? value : [];
  const unique = values => [...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
  const textMatch = (query,values) => !query || values.join(" ").toLowerCase().includes(query.trim().toLowerCase());
  const date = value => value || "未设置";
  const isDone = action => action.status === "已办";
  const isOverdue = action => action.status === "待办" && Number(action.overdue_days) > 0;
  const hasNoDate = action => action.status === "待办" && !action.deadline;
  const score = action => Number(action.overdue_days || 0) * 3 + (action.nature === "真实约定" ? 15 : 0);
  const byCustomer = name => D.actions.filter(action=>action.customer===name && action.status==="待办");
  const viewMeta = id => VIEWS.find(view=>view.id===id) || VIEWS[0];
  const option = (value,current,label) => `<option value="${esc(value)}"${String(value)===String(current)?" selected":""}>${esc(label ?? value)}</option>`;
  const empty = (title="没有匹配记录",hint="调整搜索词或清除筛选后再看。") => `<div class="empty"><strong>${esc(title)}</strong>${esc(hint)}</div>`;
  const countText = (shown,total) => `显示 ${shown} / ${total} 条`;
  const statusBadge = status => `<span class="badge ${status==="已办"?"done":status==="待办"?"todo":"neutral"}">${esc(status || "未设置")}</span>`;
  const priorityBadge = priority => `<span class="badge ${String(priority).toLowerCase()}">${esc(priority || "未分级")}</span>`;

  function go(id){
    const target = viewMeta(id).id;
    if(location.hash === `#${target}`){ state.view=target; render(); }
    else location.hash = target;
  }

  function renderTabs(){
    $("#view-tabs").innerHTML = VIEWS.map(view=>`<button class="tab" type="button" data-route="${view.id}" style="--mark:${view.color}" aria-current="${state.view===view.id?"page":"false"}"><i></i>${view.label}</button>`).join("");
  }

  function actionRow(action){
    const overdue = isOverdue(action);
    return `<article class="ledger-row">
      <div class="ledger-top">
        <div>${statusBadge(action.status)}</div>
        <div class="priority-customer">${esc(action.customer)}</div>
        <div><div class="ledger-title">${esc(action.content)}</div><div class="ledger-meta">责任方 ${esc(action.promiser || "未设置")} · 来源 ${esc(action.source || "未设置")}${action.blocker?` · 阻塞 ${esc(action.blocker)}`:""}${action.status==="待办"?` · 今日分 ${score(action)}`:""}</div></div>
        <div class="ledger-date ${overdue?"overdue":""}">${esc(date(action.deadline))}${overdue?`<br>逾期 ${Number(action.overdue_days)} 天`:hasNoDate(action)?"<br>无期限":""}</div>
      </div>
      <details class="evidence"><summary>查看出处</summary><p>${esc(action.evidence || "这条记录没有出处说明。")}</p></details>
    </article>`;
  }

  function renderOverview(){
    const todos = D.actions.filter(action=>action.status==="待办");
    const priorities = [...todos].sort((a,b)=>(isOverdue(b)-isOverdue(a)) || (Number(b.overdue_days||0)-Number(a.overdue_days||0)) || score(b)-score(a));
    const unassignedMeetings = D.meetings.filter(item=>item.customer==="未归属").length;
    const unassignedTouches = D.touchpoints.filter(item=>item.customer==="未归属").length;
    const stages = unique(D.customers.flatMap(customer=>list(customer.stage)));
    return `<p class="view-intro">${viewMeta("overview").desc} 快照日期 ${esc(D.as_of)}，全部为虚构演示数据。</p>
      <dl class="readout">
        <a href="#customers" data-route="customers"><dt>客户档案</dt><dd>${String(D.customers.length).padStart(2,"0")}</dd><small>P0 × ${D.customers.filter(c=>c.priority==="P0").length} · P1 × ${D.customers.filter(c=>c.priority==="P1").length} · P2 × ${D.customers.filter(c=>c.priority==="P2").length}</small></a>
        <a href="#actions" data-route="actions"><dt>跟进待办</dt><dd>${String(todos.length).padStart(2,"0")}</dd><small>${D.actions.filter(isOverdue).length} 条逾期 · ${D.actions.filter(hasNoDate).length} 条无期限</small></a>
        <a href="#meetings" data-route="meetings"><dt>会议素材</dt><dd>${D.meetings.length}</dd><small>${unassignedMeetings} 场待归属</small></a>
        <a href="#touchpoints" data-route="touchpoints"><dt>沟通记录</dt><dd>${D.touchpoints.length}</dd><small>${unassignedTouches} 条待归属</small></a>
      </dl>
      <div class="overview-grid">
        <section>
          <h3 class="section-title">今天先处理 <span>逾期优先，其次按今日分</span></h3>
          <div class="priority-list">${priorities.slice(0,4).map(action=>`<div class="priority-item"><div class="priority-customer">${esc(action.customer)}</div><div><div class="priority-title">${esc(action.content)}</div><div class="priority-meta">${esc(action.source || "手动记录")} · 责任方 ${esc(action.promiser || "未设置")}</div></div><div class="priority-date">${isOverdue(action)?`逾期 ${action.overdue_days} 天`:hasNoDate(action)?"待补期限":esc(action.deadline)}</div></div>`).join("")}</div>
          <p><a href="#actions" data-route="actions">查看全部 ${D.actions.length} 条跟进记录</a></p>
        </section>
        <aside>
          <section class="panel"><h3>销售流水线</h3><ol class="pipeline">
            <li><b>01</b><span>捕捉<small>邮件与会议先形成数据行</small></span></li>
            <li><b>02</b><span>归档<small>统一客户身份与最近触点</small></span></li>
            <li><b>03</b><span>提炼<small>生成待办，保留期限与出处</small></span></li>
            <li><b>04</b><span>跟进<small>每天聚焦最要紧的下一步</small></span></li>
            <li><b>05</b><span>复盘<small>每周检查推进、逾期和积压</small></span></li>
          </ol></section>
          <section class="panel"><h3>数据健康</h3>
            <div class="health-row"><span>未归属会议</span><strong class="warn">${unassignedMeetings}</strong></div>
            <div class="health-row"><span>未归属触点</span><strong class="warn">${unassignedTouches}</strong></div>
            <div class="health-row"><span>无期限待办</span><strong>${D.actions.filter(hasNoDate).length}</strong></div>
            <div class="health-row"><span>静态公开演示</span><strong>不发送消息</strong></div>
          </section>
        </aside>
      </div>
      <section class="stage-block"><h3 class="section-title">客户阶段 <span>${D.customers.length} 家虚构客户</span></h3>
        ${stages.map(stage=>{const customers=D.customers.filter(customer=>list(customer.stage).includes(stage));return `<div class="stage-row"><strong>${esc(stage)}</strong><span class="stage-names">${customers.map(customer=>esc(customer.name)).join(" · ")}</span><span class="stage-count">${customers.length} 家</span></div>`}).join("")}
      </section>`;
  }

  function filterBar(view,fields){
    const config = {
      q:{type:"input",label:"搜索",placeholder:"输入关键词"},
      priority:{type:"select",label:"优先级",options:["","P0","P1","P2"]},
      stage:{type:"select",label:"阶段",options:["",...unique(D.customers.flatMap(c=>list(c.stage)))]},
      status:{type:"select",label:"状态",options:view==="actions"?[["","全部状态"],["待办","待办"],["overdue","逾期"],["nodate","无期限"],["已办","已办"]]:view==="meetings"?["",...unique(D.meetings.map(m=>m.status))]:[]},
      customer:{type:"select",label:"客户",options:["",...unique([...D.customers.map(c=>c.name),"未归属"])]},
      source:{type:"select",label:"来源",options:["",...unique(D.touchpoints.map(t=>t.source))]}
    };
    return `<div class="table-tools">${fields.map(key=>{
      const item=config[key], value=state[view][key], id=`filter-${key}`;
      if(item.type==="input") return `<label class="search-box" for="${id}"><span>${item.label}</span><input class="input" id="${id}" data-filter="${key}" value="${esc(value)}" placeholder="${item.placeholder}" type="search"></label>`;
      const options=item.options.map(entry=>Array.isArray(entry)?option(entry[0],value,entry[1]):option(entry,value,entry===""?`全部${item.label}`:entry)).join("");
      return `<label for="${id}"><span>${item.label}</span><select id="${id}" data-filter="${key}">${options}</select></label>`;
    }).join("")}</div>`;
  }

  function wireFilters(view){
    $$('[data-filter]',$("#view")).forEach(control=>{
      const isInput=control.tagName==="INPUT";
      let timer=null,composing=false;
      const update=()=>{
        const position=control.selectionStart;
        state[view][control.dataset.filter]=control.value;
        render();
        if(isInput){
          const next=$(`#${control.id}`);
          next.focus();
          try{next.setSelectionRange(position,position)}catch{}
        }
      };
      const schedule=()=>{
        clearTimeout(timer);
        if(!composing) timer=setTimeout(update,180);
      };
      if(isInput){
        control.addEventListener("compositionstart",()=>{composing=true;clearTimeout(timer)});
        control.addEventListener("compositionend",()=>{composing=false;schedule()});
        control.addEventListener("input",schedule);
      }else control.addEventListener("change",update);
    });
    const clear=$("[data-clear-filters]",$("#view"));
    if(clear) clear.addEventListener("click",()=>{Object.keys(state[view]).forEach(key=>state[view][key]="");render()});
  }

  function renderCustomers(){
    const f=state.customers;
    const rows=D.customers.filter(customer=>textMatch(f.q,[customer.name,customer.aliases,customer.ctype,customer.blocker]) && (!f.priority || customer.priority===f.priority) && (!f.stage || list(customer.stage).includes(f.stage)));
    return `<p class="view-intro">${viewMeta("customers").desc}</p>${filterBar("customers",["q","priority","stage"])}
      <div class="result-meta"><span>${countText(rows.length,D.customers.length)}</span><button class="text-button" type="button" data-clear-filters>清除筛选</button></div>
      ${rows.length?`<div class="table-scroll"><table class="customer-table"><thead><tr><th>客户 / 别名 / 卡点</th><th>优先级</th><th>阶段</th><th>类型</th><th>最近触点</th><th class="num">待办</th></tr></thead><tbody>${rows.map(customer=>`<tr>
        <td><details class="customer-details"><summary>${esc(customer.name)}</summary><div class="details-body">别名：${esc(customer.aliases || "未设置")}<br>卡点：${esc(customer.blocker || "未设置")}<br>负责人：${esc(list(customer.owner).join("、") || "未设置")}</div></details></td>
        <td>${priorityBadge(customer.priority)}</td><td>${esc(list(customer.stage).join("、") || "未设置")}</td><td>${esc(customer.ctype || "未设置")}</td><td class="date">${esc(date(customer.last_touch))}</td><td class="num">${byCustomer(customer.name).length}</td>
      </tr>`).join("")}</tbody></table></div>`:empty()}`;
  }

  function filteredActions(){
    const f=state.actions;
    return D.actions.filter(action=>{
      const statusMatch=!f.status || (f.status==="overdue"?isOverdue(action):f.status==="nodate"?hasNoDate(action):action.status===f.status);
      return textMatch(f.q,[action.content,action.customer,action.source,action.evidence,action.promiser]) && statusMatch && (!f.customer || action.customer===f.customer);
    });
  }

  function renderActions(){
    const rows=filteredActions();
    return `<p class="view-intro">${viewMeta("actions").desc}</p>${filterBar("actions",["q","status","customer"])}
      <div class="result-meta"><span>${countText(rows.length,D.actions.length)} · 今日分 = 逾期天数 × 3 + 真实约定加权 15</span><button class="text-button" type="button" data-clear-filters>清除筛选</button></div>
      ${rows.length?`<div class="ledger">${rows.map(actionRow).join("")}</div>`:empty()}`;
  }

  function renderTouchpoints(){
    const f=state.touchpoints;
    const rows=D.touchpoints.filter(item=>textMatch(f.q,[item.subject,item.customer,item.note,item.source]) && (!f.customer || item.customer===f.customer) && (!f.source || item.source===f.source));
    return `<p class="view-intro">${viewMeta("touchpoints").desc}</p>${filterBar("touchpoints",["q","customer","source"])}
      <div class="result-meta"><span>${countText(rows.length,D.touchpoints.length)}</span><button class="text-button" type="button" data-clear-filters>清除筛选</button></div>
      ${rows.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>日期</th><th>客户</th><th>来源</th><th>主题 / 备注</th></tr></thead><tbody>${rows.map(item=>`<tr><td class="date">${esc(item.date)}</td><td>${esc(item.customer)}</td><td><span class="badge neutral">${esc(item.source)}</span></td><td><div class="cell-title">${esc(item.subject)}</div><div class="cell-sub">${esc(item.note)}</div></td></tr>`).join("")}</tbody></table></div>`:empty()}`;
  }

  function renderMeetings(){
    const f=state.meetings;
    const rows=D.meetings.filter(item=>textMatch(f.q,[item.title,item.customer,item.status,item.date]) && (!f.customer || item.customer===f.customer) && (!f.status || item.status===f.status));
    return `<p class="view-intro">${viewMeta("meetings").desc}</p>${filterBar("meetings",["q","customer","status"])}
      <div class="result-meta"><span>${countText(rows.length,D.meetings.length)}</span><button class="text-button" type="button" data-clear-filters>清除筛选</button></div>
      ${rows.length?`<div class="table-scroll"><table class="meeting-table"><thead><tr><th>日期</th><th>会议标题</th><th>客户</th><th>整理状态</th></tr></thead><tbody>${rows.map(item=>`<tr><td class="date">${esc(item.date)}</td><td class="cell-title">${esc(item.title)}</td><td>${esc(item.customer)}</td><td><span class="badge neutral">${esc(item.status || "未设置")}</span></td></tr>`).join("")}</tbody></table></div>`:empty()}`;
  }

  function renderAutomation(){
    return `<p class="view-intro">${viewMeta("automation").desc} 页面中的“已配置”不代表线上正在运行。</p>
      <div class="automation-list">${D.automations.map(auto=>`<article class="automation-row"><div class="auto-trigger">${esc(auto.schedule || auto.trigger || "手动触发")}</div><div><h3 class="auto-name">${esc(auto.name)}</h3><p class="auto-desc">${esc(auto.desc)}</p></div><div class="auto-status">${auto.enabled?"● 已配置":"○ 未启用"}</div></article>`).join("")}</div>
      <section class="rules-grid">${D.rules.slice(0,3).map((rule,index)=>`<div class="rule"><h3>硬规则 ${index+1}</h3><p>${esc(rule)}</p></div>`).join("")}</section>
      <section class="stage-block"><h3 class="section-title">已知缺口 <span>公开说明，不隐藏限制</span></h3><ul class="gap-list">${D.known_gaps.map(gap=>`<li>${esc(gap)}</li>`).join("")}</ul></section>
      <section class="inventory"><div><h3 class="section-title">四张数据表</h3><table><thead><tr><th>表</th><th class="num">记录</th></tr></thead><tbody>${D.tables.map(table=>`<tr><td>${esc(table.name)}</td><td class="num">${table.count}</td></tr>`).join("")}</tbody></table></div><div><h3 class="section-title">八个业务视图</h3><table><thead><tr><th>视图</th><th>数据表</th></tr></thead><tbody>${D.views.map(view=>`<tr><td>${esc(view.name)}</td><td>${esc(view.table)}</td></tr>`).join("")}</tbody></table></div></section>`;
  }

  function inlineMarkdown(text){
    let value=esc(text);
    value=value.replace(/`([^`]+)`/g,"<code>$1</code>");
    value=value.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    value=value.replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+|#[^\s)]+|assets\/[^\s)]+)\)/g,(match,label,url)=>`<a href="${url}"${url.startsWith("http")?' target="_blank" rel="noopener noreferrer"':""}>${label}</a>`);
    return value;
  }

  function markdownToHtml(markdown){
    const lines=markdown.replace(/\r/g,"").split("\n");
    const html=[],toc=[];
    let index=0,headingIndex=0;
    const cells=line=>line.trim().replace(/^\||\|$/g,"").split("|").map(cell=>cell.trim());
    while(index<lines.length){
      const line=lines[index],trim=line.trim();
      if(!trim){index++;continue}
      if(trim.startsWith("```")){
        const code=[];index++;
        while(index<lines.length&&!lines[index].trim().startsWith("```")){code.push(lines[index]);index++}
        index++;html.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);continue;
      }
      const image=trim.match(/^!\[([^\]]*)\]\((assets\/[^)]+)\)$/);
      if(image){html.push(`<img src="${esc(image[2])}" alt="${esc(image[1])}">`);index++;continue}
      const heading=trim.match(/^(#{1,3})\s+(.+)$/);
      if(heading){const level=heading[1].length,id=`doc-heading-${headingIndex++}`;if(level===2)toc.push({id,label:heading[2]});html.push(`<h${level} id="${id}">${inlineMarkdown(heading[2])}</h${level}>`);index++;continue}
      if(/^---+$/.test(trim)){html.push("<hr>");index++;continue}
      if(trim.startsWith(">")){
        const quote=[];while(index<lines.length&&lines[index].trim().startsWith(">")){quote.push(lines[index].trim().replace(/^>\s?/,""));index++}html.push(`<blockquote><p>${inlineMarkdown(quote.join(" "))}</p></blockquote>`);continue;
      }
      if(trim.startsWith("|")&&index+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[index+1])&&lines[index+1].includes("-")){
        const headers=cells(trim);index+=2;const rows=[];while(index<lines.length&&lines[index].trim().startsWith("|")){rows.push(cells(lines[index]));index++}
        html.push(`<div class="table-scroll"><table><thead><tr>${headers.map(cell=>`<th>${inlineMarkdown(cell)}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${inlineMarkdown(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);continue;
      }
      if(/^[-*]\s+/.test(trim)){
        const items=[];while(index<lines.length&&/^[-*]\s+/.test(lines[index].trim())){items.push(lines[index].trim().replace(/^[-*]\s+/,""));index++}html.push(`<ul>${items.map(item=>`<li>${inlineMarkdown(item)}</li>`).join("")}</ul>`);continue;
      }
      if(/^\d+\.\s+/.test(trim)){
        const items=[];while(index<lines.length&&/^\d+\.\s+/.test(lines[index].trim())){items.push(lines[index].trim().replace(/^\d+\.\s+/,""));index++}html.push(`<ol>${items.map(item=>`<li>${inlineMarkdown(item)}</li>`).join("")}</ol>`);continue;
      }
      const paragraph=[trim];index++;
      while(index<lines.length&&lines[index].trim()&&!/^(#{1,3})\s+|^```|^>|^[-*]\s+|^\d+\.\s+|^---+$/.test(lines[index].trim())){paragraph.push(lines[index].trim());index++}
      html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
    }
    return {html:html.join(""),toc};
  }

  function renderDocs(){
    const doc=markdownToHtml(README);
    return `<p class="view-intro">${viewMeta("docs").desc}</p><div class="doc-actions"><button class="button" type="button" id="download-readme">下载 README.md</button><a class="button secondary" href="https://github.com/zhoujinq/customer-commitment-ledger" target="_blank" rel="noopener noreferrer">查看 GitHub 仓库</a></div><div class="doc-layout"><nav class="doc-toc" aria-label="项目说明目录"><strong>本页目录</strong>${doc.toc.map(item=>`<a href="#${item.id}">${esc(item.label)}</a>`).join("")}</nav><article class="doc-body">${doc.html}</article></div>`;
  }

  function render(){
    const renderers={overview:renderOverview,customers:renderCustomers,actions:renderActions,touchpoints:renderTouchpoints,meetings:renderMeetings,automation:renderAutomation,docs:renderDocs};
    const meta=viewMeta(state.view);
    document.title=`${meta.label}｜${PRODUCT}`;
    $("#view-title").textContent=meta.label;
    $("#view-count").textContent=`${String(VIEWS.findIndex(view=>view.id===meta.id)+1).padStart(2,"0")} / ${String(VIEWS.length).padStart(2,"0")} · ${D.as_of}`;
    renderTabs();
    $("#view").innerHTML=renderers[meta.id]();
    if(["customers","actions","touchpoints","meetings"].includes(meta.id)) wireFilters(meta.id);
    const download=$("#download-readme");if(download)download.addEventListener("click",downloadReadme);
    $$('.doc-toc a').forEach(link=>link.addEventListener("click",event=>{event.preventDefault();const target=$(link.getAttribute("href"));if(target)target.scrollIntoView({block:"start"})}));
  }

  let toastTimer;
  function toast(message){
    const node=$("#toast");node.textContent=message;node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.hidden=true,2600);
  }

  function downloadReadme(){
    const blob=new Blob([README],{type:"text/markdown;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");
    link.href=url;link.download="README.md";document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("README.md 已开始下载");
  }

  const termLog=$("#term-log"),termInput=$("#term-input"),history=[];let historyIndex=0;
  function termPrint(text,type=""){
    const line=document.createElement("div");line.className=`term-line ${type}`;line.innerHTML=text;termLog.appendChild(line);termLog.scrollTop=termLog.scrollHeight;
  }
  function clearTerminal(){termLog.innerHTML=""}
  function resetTerminal(){
    clearTerminal();termPrint("sales:~$ today","cmd");termPrint(`${D.actions.filter(isOverdue).length} 条逾期 · ${D.actions.filter(hasNoDate).length} 条无期限 · ${D.customers.length} 家客户`,"ok");D.actions.filter(isOverdue).sort((a,b)=>b.overdue_days-a.overdue_days).forEach(action=>termPrint(`→ ${esc(action.customer)} / ${esc(action.content)}`,"muted"));termPrint("静态演示已就绪。输入 help 查看可用命令。","muted");
  }
  function runCommand(raw){
    const command=raw.trim();if(!command)return;history.push(command);historyIndex=history.length;termPrint(`sales:~$ ${esc(command)}`,"cmd");
    const key=command.toLowerCase();
    if(["clear","清屏"].includes(key)){clearTerminal();return}
    if(["help","帮助"].includes(key)){termPrint("today / 今天　　查看全部待办");termPrint("overdue / 逾期　只看逾期事项");termPrint("clients / 客户　打开客户档案");termPrint("meetings / 会议　打开会议素材");termPrint("docs / 文档　　 打开项目说明");termPrint("clear / 清屏　　清空终端输出","muted");return}
    if(["today","今天"].includes(key)){Object.assign(state.actions,{q:"",status:"待办",customer:""});go("actions");termPrint(`已打开跟进待办：${D.actions.filter(a=>a.status==="待办").length} 条待办。`,"ok");return}
    if(["overdue","逾期"].includes(key)){Object.assign(state.actions,{q:"",status:"overdue",customer:""});go("actions");termPrint(`已筛出 ${D.actions.filter(isOverdue).length} 条逾期事项。`,"warn");return}
    if(["clients","客户"].includes(key)){go("customers");termPrint(`已打开 ${D.customers.length} 家客户档案。`,"ok");return}
    if(["meetings","会议"].includes(key)){go("meetings");termPrint(`已打开 ${D.meetings.length} 场会议素材。`,"ok");return}
    if(["docs","文档"].includes(key)){go("docs");termPrint("已打开项目说明。","ok");return}
    termPrint(`未识别命令：${esc(command)}。输入 help 查看可用命令。`,"warn");
  }
  termInput.addEventListener("keydown",event=>{
    if(event.key==="Enter"){runCommand(termInput.value);termInput.value=""}
    else if(event.key==="ArrowUp"){event.preventDefault();if(history.length){historyIndex=Math.max(0,historyIndex-1);termInput.value=history[historyIndex]||""}}
    else if(event.key==="ArrowDown"){event.preventDefault();historyIndex=Math.min(history.length,historyIndex+1);termInput.value=history[historyIndex]||""}
    else if(event.key.toLowerCase()==="l"&&(event.ctrlKey||event.metaKey)){event.preventDefault();clearTerminal()}
  });

  const settings={grid:true,compact:false};
  try{Object.assign(settings,JSON.parse(localStorage.getItem("sales-assistant-settings")||"{}"))}catch{}
  function applySettings(save=true){
    document.body.classList.toggle("no-grid",!settings.grid);document.body.classList.toggle("compact",settings.compact);$("#setting-grid").checked=settings.grid;$("#setting-compact").checked=settings.compact;
    if(save){try{localStorage.setItem("sales-assistant-settings",JSON.stringify(settings))}catch{}}
  }
  $("#open-settings").addEventListener("click",()=>$("#settings-dialog").showModal());
  $("#close-settings").addEventListener("click",()=>$("#settings-dialog").close());
  $("#settings-dialog").addEventListener("click",event=>{if(event.target===$("#settings-dialog"))$("#settings-dialog").close()});
  $("#setting-grid").addEventListener("change",event=>{settings.grid=event.target.checked;applySettings()});
  $("#setting-compact").addEventListener("change",event=>{settings.compact=event.target.checked;applySettings()});
  $("#reset-settings").addEventListener("click",()=>{settings.grid=true;settings.compact=false;applySettings();toast("已恢复默认显示")});

  document.addEventListener("click",event=>{
    const route=event.target.closest("[data-route]");if(route){event.preventDefault();go(route.dataset.route)}
  });
  window.addEventListener("hashchange",()=>{state.view=viewMeta(location.hash.slice(1)).id;render()});
  state.view=viewMeta(location.hash.slice(1)).id;
  applySettings(false);resetTerminal();render();
  window.__SALES_DEMO__={data:D,state,go,render,runCommand};
  window.__APP_READY__=true;
})();
</script>
