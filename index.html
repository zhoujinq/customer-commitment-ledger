<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="creative-medium" content="interactive-prototype">
<meta name="description" content="客户承诺管理工作台：面向销售团队的客户全景、承诺追踪、触点流水、会议素材与自动化说明。">
<meta name="theme-color" content="#efede5">
<title>客户承诺管理工作台｜销售客户管理系统</title>
<style>
/* 自托管字体：Noto Sans SC / Noto Serif SC / IBM Plex Mono（OFL-1.1） */
@font-face { font-family: "Noto Sans SC"; font-style: normal; font-weight: 400; font-display: swap; src: url("assets/fonts/noto-sans-sc-400.woff2") format("woff2"); }
@font-face { font-family: "Noto Sans SC"; font-style: normal; font-weight: 500; font-display: swap; src: url("assets/fonts/noto-sans-sc-500.woff2") format("woff2"); }
@font-face { font-family: "Noto Sans SC"; font-style: normal; font-weight: 700; font-display: swap; src: url("assets/fonts/noto-sans-sc-700.woff2") format("woff2"); }
@font-face { font-family: "Noto Serif SC"; font-style: normal; font-weight: 500; font-display: swap; src: url("assets/fonts/noto-serif-sc-500.woff2") format("woff2"); }
@font-face { font-family: "Noto Serif SC"; font-style: normal; font-weight: 600; font-display: swap; src: url("assets/fonts/noto-serif-sc-600.woff2") format("woff2"); }
@font-face { font-family: "Noto Serif SC"; font-style: normal; font-weight: 700; font-display: swap; src: url("assets/fonts/noto-serif-sc-700.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("assets/fonts/ibm-plex-mono-400.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; font-display: swap; src: url("assets/fonts/ibm-plex-mono-500.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 600; font-display: swap; src: url("assets/fonts/ibm-plex-mono-600.woff2") format("woff2"); }
/* ─────────────────────────────────────────────
   客户承诺管理工作台 — 交付台账视觉系统
   ───────────────────────────────────────────── */

:root {
  --ink: #191c19;
  --ink-2: #3b403a;
  --muted: #6d7268;
  --paper: #efede5;
  --surface: #faf8f2;
  --surface-2: #e6e3d7;
  --rule: #d3cfbf;
  --rule-strong: #b6b2a2;
  --signal: #c2401e;
  --signal-soft: #f2e1d7;
  --verdi: #1c5b49;
  --verdi-soft: #dfe9e2;
  --brass: #8a6a2b;
  --machine: #16211c;
  --machine-ink: #e8e4d6;
  --machine-rule: #33443b;
  --row-pad: 13px;
  --serif: "Noto Serif SC", "Songti SC", serif;
  --sans: "Noto Sans SC", "PingFang SC", sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", monospace;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-wrap: pretty;
}

::selection { background: var(--signal); color: #fff; }

a { color: inherit; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--signal); }

button { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--signal);
  outline-offset: 2px;
}

/* ── shell ─────────────────────────────── */

.wb {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  min-height: 100vh;
}

.rail {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 26px;
  padding: 22px 0 18px;
  background: var(--surface-2);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
}

.rail__brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 20px;
}

.seal {
  width: 38px;
  height: 38px;
  flex: none;
  display: grid;
  place-items: center;
  border: 1.5px solid var(--signal);
  color: var(--signal);
  font-family: var(--serif);
  font-weight: 700;
  font-size: 19px;
  line-height: 1;
  letter-spacing: -1px;
  transform: rotate(-2deg);
}

.rail__brand b {
  display: block;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: 0.02em;
}

.rail__brand span {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--muted);
  text-transform: uppercase;
}

.rail__nav { display: flex; flex-direction: column; }

.rail__label {
  padding: 0 20px 8px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: var(--muted);
  text-transform: uppercase;
}

.navitem {
  display: grid;
  grid-template-columns: 26px 1fr auto;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 9px 20px 9px 18px;
  border: 0;
  border-left: 2px solid transparent;
  background: none;
  text-align: left;
  cursor: pointer;
  color: var(--ink-2);
  transition: background 140ms ease, color 140ms ease;
}

.navitem:hover { background: rgba(0, 0, 0, 0.035); color: var(--ink); }

.navitem__num {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
}

.navitem__name { font-size: 13.5px; font-weight: 500; letter-spacing: 0.01em; }

.navitem__badge {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  padding: 1px 5px;
  border: 1px solid var(--rule);
  background: rgba(255, 255, 255, 0.4);
}

.navitem[aria-current="true"] {
  background: var(--paper);
  border-left-color: var(--signal);
  color: var(--ink);
}

.navitem[aria-current="true"] .navitem__num { color: var(--signal); }

.rail__foot {
  margin-top: auto;
  padding: 16px 20px 0;
  border-top: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 7px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  line-height: 1.7;
}

.pulse {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--verdi);
}

.pulse i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 0 3px rgba(28, 91, 73, 0.14);
}

.masktoggle {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border: 1px dashed var(--rule-strong);
  background: rgba(255, 255, 255, 0.35);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.04em;
  color: var(--ink-2);
  cursor: pointer;
  transition: all 130ms ease;
}

.masktoggle:hover { border-color: var(--signal); color: var(--ink); }

.masktoggle[aria-pressed="true"] {
  border-style: solid;
  border-color: var(--signal);
  color: var(--signal);
  background: var(--signal-soft);
}

.masktoggle__led {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--rule-strong);
  flex: none;
}

.masktoggle[aria-pressed="true"] .masktoggle__led {
  background: var(--signal);
  box-shadow: 0 0 0 3px rgba(194, 64, 30, 0.15);
}

.masktoggle__hint {
  margin: 7px 2px 0;
  font-size: 10px;
  color: var(--muted);
  line-height: 1.6;
}

/* ── main ──────────────────────────────── */

.main { min-width: 0; display: flex; flex-direction: column; }

.tape {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 9px 40px;
  background: var(--machine);
  color: var(--machine-ink);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.tape b { color: #f0a58b; font-weight: 500; }

.tape__right { margin-left: auto; display: flex; align-items: center; gap: 18px; }

.tape a { color: var(--machine-ink); text-decoration-color: var(--machine-rule); }

.settings-fab {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 70;
  padding: 10px 15px;
  border: 1px solid #6b756e;
  background: var(--machine);
  color: var(--machine-ink);
  box-shadow: 0 8px 28px rgba(24, 31, 27, 0.18);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  cursor: pointer;
}
.settings-fab:hover { border-color: #a8b5ab; background: #27332d; }
.settings-fab:focus-visible { outline: 2px solid #f0a58b; outline-offset: 3px; }

.page {
  width: 100%;
  max-width: 1240px;
  padding: 36px 40px 80px;
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
}

.eyebrow::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--rule);
}

.page-title {
  margin: 8px 0 0;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 38px;
  line-height: 1.25;
  letter-spacing: -0.01em;
}

.page-lead {
  margin: 12px 0 0;
  max-width: 60ch;
  font-size: 14px;
  line-height: 1.85;
  color: var(--ink-2);
}

.head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 30px;
  flex-wrap: wrap;
}

.head > div:first-child {
  flex: 1 1 560px;
  min-width: 0;
}

.head__meta {
  display: flex;
  gap: 26px;
  padding-bottom: 4px;
}

.head__meta div { font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.7; }
.head__meta b { display: block; font-size: 18px; color: var(--ink); font-weight: 500; }

/* ── primitives ────────────────────────── */

.panel {
  background: var(--surface);
  border: 1px solid var(--rule);
}

.panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--rule);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.panel__body { padding: 18px; min-width: 0; }

.grid-2 { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.sec-title {
  margin: 0;
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.sec-note { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.7; }

.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  border: 1px solid var(--rule-strong);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  line-height: 1.6;
  white-space: nowrap;
  background: rgba(255, 255, 255, 0.35);
}

.tag--p0 { border-color: var(--signal); color: var(--signal); background: var(--signal-soft); }
.tag--p1 { border-color: var(--brass); color: var(--brass); background: #f0e8d6; }
.tag--p2 { border-color: #7d8a8a; color: #52605f; background: #e7ebe7; }
.tag--open { border-color: var(--ink-2); color: var(--ink-2); }
.tag--done { border-color: var(--verdi); color: var(--verdi); background: var(--verdi-soft); }
.tag--late { border-color: var(--signal); color: #fff; background: var(--signal); }
.tag--ghost { border-style: dashed; color: var(--muted); }

.dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

.hr { height: 1px; background: var(--rule); border: 0; margin: 0; }

/* ── KPI ───────────────────────────────── */

.kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 2px solid var(--ink);
  margin-top: 26px;
}

.kpi {
  padding: 14px 18px 0 0;
  border-right: 1px solid var(--rule);
}
.kpi:last-child { border-right: 0; }

.kpi__label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}

.kpi__value {
  font-family: var(--mono);
  font-size: 40px;
  font-weight: 500;
  line-height: 1.1;
  letter-spacing: -0.03em;
  margin-top: 6px;
}

.kpi__value small { font-size: 13px; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.kpi__foot { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.kpi__foot em { font-style: normal; color: var(--signal); }

/* ── push preview (machine panel) ──────── */

.machine {
  background: var(--machine);
  color: var(--machine-ink);
  border: 1px solid #0b120e;
  display: flex;
  flex-direction: column;
}

.machine__head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--machine-rule);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #9fb0a5;
}

.machine__body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

.msg {
  border-left: 2px solid #46604f;
  padding-left: 12px;
}

.msg__top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.msg__cust { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: #f0a58b; text-transform: uppercase; }
.msg__score { font-family: var(--mono); font-size: 11px; color: #9fb0a5; }
.msg__text { font-size: 13px; line-height: 1.7; margin: 5px 0 6px; color: #f3f0e4; }
.msg__meta { font-family: var(--mono); font-size: 10.5px; color: #9aab9f; display: flex; flex-wrap: wrap; gap: 10px; }

.machine__foot {
  margin-top: auto;
  padding: 10px 16px;
  border-top: 1px dashed var(--machine-rule);
  font-family: var(--mono);
  font-size: 10.5px;
  color: #9fb0a5;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}
.machine__foot b { color: #f0a58b; font-weight: 500; }

/* ── score ruler ───────────────────────── */

.ruler { display: flex; align-items: center; gap: 9px; min-width: 132px; }

.ruler__track {
  position: relative;
  flex: 1;
  height: 10px;
  background:
    repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px 20%),
    var(--surface-2);
  border-bottom: 1px solid var(--rule-strong);
}

.ruler__fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--signal);
  opacity: 0.85;
}

.ruler__fill--calm { background: var(--verdi); }
.ruler__fill--muted { background: var(--rule-strong); }

.ruler__val {
  font-family: var(--mono);
  font-size: 11.5px;
  min-width: 30px;
  text-align: right;
  color: var(--ink-2);
}

/* ── ledger table ──────────────────────── */

.ledger { width: 100%; border-collapse: collapse; }

.ledger th {
  text-align: left;
  padding: 9px 12px;
  border-bottom: 1px solid var(--rule-strong);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 400;
  white-space: nowrap;
}

.ledger td {
  padding: var(--row-pad) 12px;
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
  font-size: 13px;
}

.ledger tbody tr:last-child td { border-bottom: 0; }
.ledger tbody tr:hover td { background: rgba(255, 255, 255, 0.55); }
.ledger .num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ledger .strong { font-weight: 500; }

.ledger--interactive tbody tr { cursor: pointer; }

/* ── flow ──────────────────────────────── */

.flow {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border-top: 1px solid var(--ink);
}

.step {
  padding: 16px 20px 0 0;
  border-right: 1px solid var(--rule);
  position: relative;
}
.step:last-child { border-right: 0; }
.step + .step { padding-left: 20px; }

.step__no {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--signal);
  letter-spacing: 0.12em;
}

.step__title {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 600;
  margin-top: 4px;
}

.step__desc { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.7; }

.step__foot {
  margin-top: 12px;
  padding-top: 8px;
  border-top: 1px dashed var(--rule);
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--ink-2);
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.step--pending .step__no { color: var(--brass); }
.step--pending { background: linear-gradient(180deg, rgba(138, 106, 43, 0.06), transparent 70%); }

/* ── filters ───────────────────────────── */

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.chip {
  padding: 5px 11px;
  border: 1px solid var(--rule-strong);
  background: transparent;
  font-size: 12px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 130ms ease;
}

.chip:hover { border-color: var(--ink-2); }

.chip[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper);
}

.chip span { font-family: var(--mono); font-size: 10px; opacity: 0.65; }

.search {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--rule-strong);
  background: var(--surface);
  padding: 5px 10px;
  min-width: 220px;
}

.search input {
  border: 0;
  background: none;
  outline: none;
  font: inherit;
  font-size: 12.5px;
  color: var(--ink);
  width: 100%;
}

.search input::placeholder { color: var(--muted); }

/* ── customer rows ─────────────────────── */

.cust {
  border-bottom: 1px solid var(--rule);
}
.cust:last-child { border-bottom: 0; }

.cust__row {
  display: grid;
  grid-template-columns: 54px minmax(0, 1.6fr) 110px 120px 90px 90px 22px;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 14px 16px;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
}

.cust__row:hover { background: rgba(255, 255, 255, 0.5); }

.cust__name {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
}

.cust__alias {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.cust__cell { font-family: var(--mono); font-size: 11px; color: var(--ink-2); line-height: 1.6; }
.cust__cell span { display: block; color: var(--muted); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; }

.cust__caret { font-family: var(--mono); color: var(--muted); font-size: 14px; transition: transform 160ms ease; }
.cust__row[aria-expanded="true"] .cust__caret { transform: rotate(45deg); color: var(--signal); }

.cust__detail {
  padding: 4px 16px 22px 84px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.detail-block h4 {
  margin: 0 0 6px;
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 400;
}

.mini-row {
  display: flex;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px dotted var(--rule);
  font-size: 12px;
  line-height: 1.6;
}
.mini-row:last-child { border-bottom: 0; }
.mini-row .mono { flex: none; font-size: 10.5px; color: var(--muted); padding-top: 2px; }

/* ── action rows ───────────────────────── */

.action-row { border-bottom: 1px solid var(--rule); }
.action-row:last-child { border-bottom: 0; }
.action-row.is-late { background: linear-gradient(90deg, rgba(194, 64, 30, 0.055), transparent 45%); }

.action-main {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 150px;
  gap: 22px;
  padding: 15px 18px;
  cursor: pointer;
  align-items: start;
}

.action-main:hover { background: rgba(255, 255, 255, 0.42); }

.action-title { font-size: 13.5px; line-height: 1.65; font-weight: 500; }
.action-sub { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 7px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.action-sub .late { color: var(--signal); }

.action-evidence {
  margin: 0 18px 16px;
  padding: 12px 14px;
  background: var(--surface-2);
  border-left: 2px solid var(--rule-strong);
  font-size: 12px;
  line-height: 1.8;
  color: var(--ink-2);
}

.action-evidence b { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; font-weight: 400; }

/* ── mail rows ─────────────────────────── */

.mail {
  display: grid;
  grid-template-columns: 78px minmax(0, 1fr) 150px;
  gap: 16px;
  padding: 11px 18px;
  border-bottom: 1px solid var(--rule);
  align-items: baseline;
}
.mail:last-child { border-bottom: 0; }
.mail__date { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.mail__subject { font-size: 12.5px; line-height: 1.6; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.mail__from { font-family: var(--mono); font-size: 10px; color: var(--muted); text-align: right; overflow-wrap: anywhere; }
.mail.is-open { background: rgba(194, 64, 30, 0.045); }
.mail.is-open .mail__date { color: var(--signal); }

/* ── meeting ───────────────────────────── */

.bars { display: flex; align-items: flex-end; gap: 5px; height: 88px; padding-top: 8px; }

.bars__col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; }

.bars__bar {
  width: 100%;
  background: var(--ink-2);
  min-height: 3px;
  position: relative;
}
.bars__bar i { position: absolute; inset: auto 0 0 0; background: var(--signal); opacity: 0.75; }
.bars__lbl { font-family: var(--mono); font-size: 8.5px; color: var(--muted); }

.meet-row {
  display: grid;
  grid-template-columns: 70px minmax(0, 1fr) 140px 64px;
  gap: 14px;
  padding: 9px 18px;
  border-bottom: 1px solid var(--rule);
  align-items: center;
}
.meet-row:last-child { border-bottom: 0; }
.meet-row:hover { background: rgba(255, 255, 255, 0.5); }
.meet-row__date { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.meet-row__title { font-size: 12.5px; line-height: 1.55; }
.meet-row__title a { text-decoration: none; }
.meet-row__title a:hover { text-decoration: underline; text-decoration-color: var(--signal); }
.meet-row__cust { font-family: var(--mono); font-size: 10px; color: var(--ink-2); }
.meet-row__state { justify-self: end; }

/* ── automation cards ──────────────────── */

.auto { border: 1px solid var(--rule); background: var(--surface); display: flex; flex-direction: column; }
.auto__top { padding: 14px 16px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.auto__name { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.4; }
.auto__id { font-family: var(--mono); font-size: 9.5px; color: var(--muted); margin-top: 3px; }
.auto__body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.auto__desc { font-size: 12.5px; line-height: 1.75; color: var(--ink-2); }
.auto__meta { display: flex; flex-direction: column; gap: 4px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: auto; padding-top: 10px; border-top: 1px dashed var(--rule); }
.auto__meta b { color: var(--ink-2); font-weight: 500; }

.scriptline {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px dotted var(--rule);
  font-family: var(--mono);
  font-size: 11px;
}
.scriptline:last-child { border-bottom: 0; }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.two-col > div { padding: 14px 18px; }
.two-col > div:first-child { border-right: 1px solid var(--machine-rule); }

.kv { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px dotted var(--machine-rule); font-size: 12.5px; }
.kv:last-child { border-bottom: 0; }
.kv span { color: #9fb0a5; font-family: var(--mono); font-size: 10.5px; }

.gap {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dotted var(--rule);
  font-size: 12.5px;
  line-height: 1.7;
}
.gap:last-child { border-bottom: 0; }
.gap__no { font-family: var(--mono); font-size: 10px; color: var(--signal); padding-top: 3px; }

/* ── handover doc ──────────────────────── */

.docwrap { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 42px; align-items: start; }

.toc {
  position: sticky;
  top: 26px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  border-left: 1px solid var(--rule);
  padding-left: 14px;
}

.toc a {
  font-size: 12px;
  color: var(--muted);
  text-decoration: none;
  padding: 4px 0;
  line-height: 1.5;
}
.toc a:hover { color: var(--signal); }

.doc { max-width: 78ch; }

.doc h1 {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 600;
  margin: 0 0 8px;
  line-height: 1.35;
}

.doc h2 {
  font-family: var(--serif);
  font-size: 23px;
  font-weight: 600;
  margin: 40px 0 10px;
  padding-top: 14px;
  border-top: 1px solid var(--rule-strong);
  line-height: 1.4;
}

.doc h3 {
  font-family: var(--sans);
  font-size: 14.5px;
  font-weight: 700;
  margin: 22px 0 6px;
}

.doc p { font-size: 13.5px; line-height: 1.95; margin: 0 0 12px; color: var(--ink-2); }
.doc strong { color: var(--ink); font-weight: 700; }
.doc ul, .doc ol { margin: 0 0 14px; padding-left: 20px; }
.doc li { font-size: 13.5px; line-height: 1.9; color: var(--ink-2); margin-bottom: 3px; }
.doc li::marker { color: var(--signal); font-family: var(--mono); font-size: 11px; }
.doc blockquote {
  margin: 0 0 16px;
  padding: 10px 14px;
  border-left: 2px solid var(--signal);
  background: var(--signal-soft);
  font-size: 12.5px;
  line-height: 1.85;
  color: var(--ink-2);
}
.doc blockquote p { margin: 0; font-size: 12.5px; }
.doc code {
  font-family: var(--mono);
  font-size: 11.5px;
  background: var(--surface-2);
  padding: 1px 5px;
}
.doc a { color: var(--verdi); }
.doc table { width: 100%; border-collapse: collapse; margin: 10px 0 18px; border-top: 1px solid var(--ink); }
.doc th {
  text-align: left;
  padding: 7px 10px 7px 0;
  border-bottom: 1px solid var(--rule-strong);
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 400;
}
.doc td {
  padding: 9px 10px 9px 0;
  border-bottom: 1px solid var(--rule);
  font-size: 12px;
  line-height: 1.7;
  vertical-align: top;
  color: var(--ink-2);
}
.doc td:first-child { font-weight: 500; color: var(--ink); }
.doc hr { border: 0; border-top: 1px solid var(--rule); margin: 26px 0; }

.doc-actions { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 13px;
  border: 1px solid var(--ink);
  background: var(--ink);
  color: var(--paper);
  font-size: 12px;
  text-decoration: none;
  cursor: pointer;
  transition: background 130ms ease;
}
.btn:hover { background: var(--signal); border-color: var(--signal); }
.btn--ghost { background: transparent; color: var(--ink); }
.btn--ghost:hover { background: var(--signal); color: #fff; }

.skip-link {
  position: fixed;
  z-index: 10000;
  top: 10px;
  left: 10px;
  padding: 9px 14px;
  background: var(--ink);
  color: var(--surface);
  transform: translateY(-160%);
  transition: transform 120ms ease;
}
.skip-link:focus { transform: translateY(0); }

.release-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 15px 18px;
  border: 1px solid var(--rule-strong);
  border-left: 3px solid var(--verdi);
  background: linear-gradient(105deg, rgba(255,255,255,.52), rgba(255,255,255,.16));
}
.release-strip__label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--verdi);
  text-transform: uppercase;
}
.release-strip__copy {
  margin-top: 4px;
  max-width: 72ch;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.75;
}
.release-strip__actions { display: flex; gap: 8px; flex-wrap: wrap; flex: none; }
.masktoggle--static { cursor: default; border-style: solid; border-color: var(--verdi); color: var(--verdi); background: var(--verdi-soft); }
.masktoggle--static .masktoggle__led { background: var(--verdi); box-shadow: 0 0 0 3px rgba(28,91,73,.14); }

/* ── misc ──────────────────────────────── */

.note {
  display: flex;
  gap: 10px;
  padding: 11px 14px;
  border: 1px dashed var(--rule-strong);
  background: rgba(255, 255, 255, 0.4);
  font-size: 12px;
  line-height: 1.75;
  color: var(--ink-2);
}

.note b { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--signal); flex: none; padding-top: 2px; }

.footer {
  margin-top: 12px;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.04em;
}

.wb[data-scores="off"] .ruler { display: none; }

.fade-in { animation: fadeIn 320ms ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ── density ───────────────────────────── */

.wb[data-density="compact"] { --row-pad: 9px; }
.wb[data-density="relaxed"] { --row-pad: 20px; }
.wb[data-density="compact"] .page { gap: 22px; padding-top: 28px; }
.wb[data-density="relaxed"] .page { gap: 40px; }

/* ── responsive ────────────────────────── */

@media (max-width: 1120px) {
  .grid-2 { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr; }
  .docwrap { grid-template-columns: 1fr; gap: 20px; }
  .toc { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px 14px; border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 10px; }
  .cust__row { grid-template-columns: 46px minmax(0, 1fr) 90px 90px 20px; }
  .cust__row > :nth-child(6) { display: none; }
}

@media (max-width: 860px) {
  .wb { grid-template-columns: 1fr; }
  .rail {
    position: static;
    height: auto;
    flex-direction: row;
    align-items: center;
    gap: 14px;
    padding: 10px 14px;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid var(--rule);
  }
  .rail__brand { flex: none; }
  .rail__brand span, .rail__label, .rail__foot, .rail__privacy { display: none; }
  .panel__body { overflow-x: auto; }
  .rail__nav { flex-direction: row; gap: 2px; }
  .navitem { display: flex; gap: 6px; padding: 6px 10px; border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
  .navitem[aria-current="true"] { border-bottom-color: var(--signal); }
  .navitem__badge, .navitem__num { display: none; }
  .page { padding: 22px 16px 56px; }
  .release-strip { flex-direction: column; align-items: flex-start; gap: 12px; }
  .release-strip__actions { width: 100%; }
  .release-strip__actions .btn { flex: 1 1 150px; justify-content: center; }
  .tape { padding: 8px 16px; gap: 10px; font-size: 9.5px; }
  .tape__right { display: none; }
  .page-title { font-size: 27px; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi { border-right: 0; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
  .kpi:nth-child(odd) { border-right: 1px solid var(--rule); }
  .kpi__value { font-size: 32px; }
  .flow { grid-template-columns: 1fr 1fr; }
  .step { border-right: 0; padding: 14px 0 10px !important; border-bottom: 1px solid var(--rule); }
  .cust__row { grid-template-columns: 40px minmax(0, 1fr) 20px; gap: 10px; }
  .cust__row > :nth-child(n+3):not(.cust__caret) { display: none; }
  .cust__detail { padding-left: 16px; grid-template-columns: 1fr; gap: 16px; }
  .action-main { grid-template-columns: 1fr; gap: 12px; }
  .mail { grid-template-columns: 62px minmax(0, 1fr); gap: 10px; }
  .mail__from { grid-column: 2; text-align: left; }
  .meet-row { grid-template-columns: 62px minmax(0, 1fr); gap: 8px 10px; }
  .meet-row__cust { grid-column: 2; }
  .meet-row__state { grid-column: 2; justify-self: start; }
  .two-col { grid-template-columns: 1fr; }
  .two-col > div:first-child { border-right: 0; border-bottom: 1px solid var(--machine-rule); }
  .doc h1 { font-size: 26px; }
  .doc h2 { font-size: 20px; }
  .doc table { display: block; overflow-x: auto; white-space: nowrap; }
  .head__meta { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

<script>window.HANDOVER_MD = "# 客户承诺管理系统交接文档\n\n> **脱敏版说明**：客户以「客户A–F」指代；联系人、邮箱、物流单号、外部链接与资源 token 均替换为占位符。所有数字（行数、天数、日期、金额量级）与真实快照一致。\n\n> 本文档是「客户承诺管理」系统的完整交接说明，面向接手人（人或 AI）。写于 2026-11-18，数据快照以当日为准。读完本文档 + 浏览一遍工作台网页，即可接手日常维护与后续切片开发。\n\n## 一、这个系统是什么、解决什么问题\n\n这是一套搭建在豆包工作伙伴 + 飞书多维表格上的**销售客户承诺管理系统**（内部叫「CRM 承诺管理」），由 发起人（产品营销中心营销组）发起，Workbuddy 指导、发起人的智能伙伴实施，按 MVP 垂直切片 + TDD 方式开发。\n\n它要解决的核心问题：**销售对客户做过的每一个承诺（发货、报价、跟进、回邮件），散落在邮件、妙记、聊天里，没人统一盯着，到期了没人催、逾期了没人知道。**\n\n系统的做法是把承诺变成可管理的机器数据，四个环节闭环：\n\n1. **捕捉**：新客户邮件自动落「触点」表；妙记（会议录音转写）自动建「会议」行——承诺的原始素材不再散落。\n2. **提炼**：从会议/邮件素材中抽出「行动」（= 我对客户的承诺或客户对我的承诺），带期限、带出处原话。\n3. **追踪**：每天早上 8:30，系统算好每条承诺的「今日分」（逾期天数×3 + 真实约定加 15），把最要紧的两条推到你手机私聊。\n4. **复盘**：每周六 14:30 一份周复盘：本周兑现了几条、逾期最长的是哪几条、素材积压多少、兑现率多少。\n\n一句话：**邮件和会议进来，行动和提醒出去。**\n\n## 二、系统地图（所有资源一图流）\n\n| 资源 | 类型 | 链接 / 标识 | 作用 |\n|---|---|---|---|\n| 客户承诺管理 Base | 多维表格（数据底座） | 链接已脱敏 | 全部数据在这：4 张表 + 8 个视图 |\n| Progress.md | 开发进度文档 | 链接已脱敏 | 切片 0-4 全部实现说明、验收记录、已知缺口，**接手必读** |\n| 任务书 v2 + 补丁 v2.1 | 规格基线 | 见 发起人的智能伙伴沙箱本地 v2_msg.md / v2_1_patch.md（如需可让其导出为云文档） | 系统需求的原始规格 |\n| CRM 工作台网页 | 可视化工作台 | （交付时附，本工作台即该网页） | 一页看全系统现状：客户全景、承诺追踪、触点流水、会议素材、自动化总览 |\n| 相关周边文档 | 上下游 | 见 §八 | 会前准备文档、客户思维导图、客户A 售后文档、T1 口径速查表等 |\n\n## 三、数据底座：4 张表（Base 内）\n\nBase token：`BASE_TOKEN（已脱敏）`\n\n| 表 | table_id | 现有行数 | 关键字段 | 说明 |\n|---|---|---|---|---|\n| 客户 | tbl_客户（脱敏） | 6 | 客户名、别名、优先级、阶段、卡点、关键人（五段格式）、最后触点日、邮箱域名、归属 | 别名是自动归属的匹配依据；关键人格式=「姓名｜角色｜态度（枚举）｜邮箱｜最后接触」，多人用 ‖ 分隔 |\n| 行动 | tbl_行动（脱敏） | 8 | 内容、客户、状态（待办/已办/已废）、期限、期限性质（真实约定/我方估计）、来源、承诺方、阻塞项、出处、今日分 | 「行动」= 承诺的最小管理单元；今日分由脚本每晨写入 |\n| 会议 | tbl_会议（脱敏） | 47 | 标题、妙记token（唯一去重键）、日期、客户、妙记链接、提炼状态（未提炼/抽取中/待裁决/已确认）、摘要 | 切片 3 素材层已落 47 场妙记（窗口 2026-10-09~10-23），主阶段（抽取+裁决卡）未开发 |\n| 触点 | tbl_触点（脱敏） | 17 | 主题、客户、日期、来源（邮件）、来源ID（=邮件 message_id，幂等键）、备注 | 由 A2 自动化实时落表，10-23 起持续运行 |\n\n### 视图（8 个）\n\n- 「今天」（行动表 vew_今天）：筛选 状态=待办 ∧ 今日分非空，今日分降序——每天该干什么。\n- 「风险雷达」（行动表 vew_风险雷达）：筛选 待办 ∧ 期限<Today（Today 滚动关键字，自动更新），期限升序——逾期承诺排行。\n- 「客户全景」（客户表 vew_客户全景）：按优先级 P0→P2 分组，组内最后触点日降序。\n- 5 个异常视图：客户·卡点为空 vew_卡点为空 / 行动·已废无原因 vew_已废无原因 / 行动·期限缺失 vew_期限缺失 / 会议·未归属 vew_会议未归属 / 触点·未归属 vew_触点未归属。\n\n### 客户与优先级现状（2026-11-18 快照）\n\n- P0：客户A（海外，8 台 T1 已交付，最后触点 11-02）、客户B（海外）、客户C（合作院校渠道）\n- P1：客户D（关键人D）\n- P2：客户E（最后触点 11-05）、客户F（最后触点 11-03）\n\n行动表现状：逾期待办 2（客户C合同违约金 09-03 逾期、客户A 海外海关批复 09-24 逾期）、无期限待办 3、未到期 1、已办 2。\n\n## 四、自动化（3 个核心 + 1 个事件订阅，全部在跑）\n\n| 自动化 | 触发 | 逻辑 | 状态 |\n|---|---|---|---|\n| A3 每日承诺推送（auto_A3每日推送） | 每天 08:30 cron | 脚本 `crm_a3_daily.py`：读行动表→算今日分（逾期天数×3+真实约定15）→只写到到期行→推送 top2 到用户私聊；同客户最多占 top2 一条（被压掉的补一句「另：X 还有 N 条到期」）；空态也必发；[测试] 行排除；数据异常 N 项=5 个异常视图求和 | ✅ 10-23 上线，每日稳定运行 |\n| A2 新邮件触点落表（auto_A2邮件触点） | 收到新邮件（事件） | 脚本 `crm_a2_email_touchpoint.py`：三级匹配（关键人邮箱→邮箱域名→未归属）落触点表；message_id 幂等；最后触点日只前进不后退；内部邮件（本公司域名）跳过；静默不推送 | ✅ 10-23 上线，触点表已自然积累 17 行 |\n| A4 周复盘（auto_A4周复盘） | 每周六 14:30 cron | 脚本 `crm_a4_weekly.py`（纯只读）：本周承诺变动/逾期 Top3/积压（会议+触点未归属）/兑现率与「响应 vs 推进」判断 | ✅ 10-23 上线 |\n| 夜班报告 07:30（auto_夜班报告（已停用）） | 一次性（已过期） | 2026-10-23 夜班交付报告，历史产物 | 已停用 |\n\n脚本位置：`（脚本目录已脱敏）/` 下的 `crm_a3_daily.py`、`crm_a2_email_touchpoint.py`、`crm_a4_weekly.py`（均只读或机器字段写入，逻辑固化在脚本、自动化任务只负责执行+转发 stdout）。\n\n配套的「新妙记自动规范命名」自动化（auto_妙记规范命名，每次妙记生成后按规则改名）与「客户邮件自动拟回复草稿」（auto_邮件拟稿）是独立体系，与本系统无数据耦合，但同属 发起人 的销售工作流。\n\n## 五、开发过程与切片状态\n\n按 MVP 垂直切片开发，规格=任务书 v2 + 补丁 v2.1，节奏承诺「单片不跨天」：\n\n| 切片 | 内容 | 状态 |\n|---|---|---|\n| 0 | 骨架：4 表 + 5 异常视图 + 数据落表 | ✅ 完成（10-20），10-22 评审有条件通过、10-23 返工完成 |\n| 1 | 「今天」视图 + A3 每日推送 | ✅ 完成（10-23），Workbuddy 验收 5 过 1 待 |\n| 2 | A2 新邮件触点 | ✅ 完成（10-23 夜班），自测 5 条全过 |\n| 3 | A1 妙记→会议行 + 行动草案 + 待裁决卡 | 🟡 素材层完成（47 行），抽取/裁决卡未开始 |\n| 4 | 风险雷达 + 客户全景 + A4 周复盘 | ✅ 只读部分完成（10-23 夜班） |\n| 5 | 公式/聚合/沉默天数 + 降级机器写 max() | 未开始 |\n\n关键设计决策（接手前必知）：\n\n- **优先级体系**：P0/P1/P2（用户拍板，废弃 S/A/B/C）。判级逻辑=先明确需求→预算+可行性+技术团队都满足=高质量；已成交=无条件 P0。\n- **机器只写机器字段**：今日分、最后触点日、触点、会议行由自动化写；卡点/优先级/阶段/归属这些业务判断字段**机器永远不写**，只能由人改。这是系统的安全底线。\n- **别名 + 词边界匹配**：客户自动归属靠客户名+别名（如 客户A 的 别名A1/别名A2、客户B 的 别名B1），短英文别名加 ASCII 词边界检查（别名B1 两侧不允许是字母/数字，防止 \"Industry\" 里的 tr 误匹配）。\n- **「客户A（惯称）」悬念**：3 场含「客户A（惯称）」字样的会议未归属到 客户A，因别名表无该词。若确认等同，在客户表别名栏加一词、重跑素材脚本即自动归上（幂等）。\n\n## 六、无人值守三条硬规则（系统运行的安全底线）\n\n1. **不写业务判断字段**：卡点/优先级/阶段/归属只能人改，机器只提案。\n2. **不自动确认待裁决项**：待裁决的抽取结果必须人确认。\n3. **失败即停，重试不超过 2 次**：自动化报错就停，不无限重试刷爆日志。\n\n## 七、已知缺口与待决事项（接手人优先看）\n\n已知缺口（详见 Progress.md §12.3）：\n\n- 阶段停滞（同阶段>21 天）无字段支撑——候选解法：客户表加系统创建/修改时间字段，或切片 5 处理。\n- 「本周新增承诺」无法精确统计——行动表无创建时间字段，接口不返回。\n- 「本周废弃」只能报全量口径——无废弃日期字段。\n- 「最后触点日」只由 A2 机器写入，6 家历史客户未回填（按不回填处理）。\n\n待用户定的（悬而未决）：\n\n- P0/P1/P2 两个后果：C 级客户无档位时是否看归属字段；「已成交=P0」会把交付项长期钉在 top-2，可能挤出新单提示。\n- 切片 2 自测第 4 条完整版：真实客户邮件下拟稿 5 分钟出草稿+五段通知的自然复验。\n\n## 八、相关联文档（客户工作线全套资源）\n\n| 文档 | 链接 | 与本系统关系 |\n|---|---|---|\n| 交接文档（客户线索工作线） | 链接已脱敏 | 客户线索捋清工作线的交接总纲（7 条待办、客户档案快照、工作方法），本系统的客户数据与其同源 |\n| 商机全景速览 | 链接已脱敏 | 全部商机的横切速览，客户优先级判级的上游参考 |\n| 客户全景清单（表格） | 链接已脱敏 | 客户总表（148+ 行），本系统客户表是其承诺管理子集 |\n| 客户沟通：会前准备与会后复盘 | 链接已脱敏 | 每次客户会议的会前准备模板，会后复盘回填与本系统会议表呼应 |\n| 客户前期问询思维导图 | 链接已脱敏 | 销售线索筛选逻辑（四维：预算/PR or Solution/技术团队/场景），新客户判级的参考框架 |\n| 客户A 售前售后问题归纳 | 链接已脱敏 | P0 客户 客户A 的全部售后口径与 SN 码登记，售后承诺的事实依据 |\n| T1 产品口径速查表 | 链接已脱敏 | 产品规格/认证/售后问题的对外口径，拟邮件与客户沟通时的事实边界 |\n| IROS 2026 客户跟进表（Base） | 链接已脱敏 | 展会线索跟进，与本系统客户表互补 |\n| Progress.md | 链接已脱敏 | 本系统开发全程记录（切片 0-4 实现说明+验收+缺口） |\n\n## 九、日常维护手册（接手人每天/每周做什么）\n\n**每天早上（收到 8:30 推送后）**：看推送的两条最要紧承诺，处理或推进；推送末尾有「待裁决 N / 未归属 N / 数据异常 N」三个健康指标，异常时去 Base 对应异常视图手工修数据。\n\n**每周（周六 14:30 周复盘后）**：看兑现了几条、逾期最长的是谁、素材积压多少——积压大说明妙记/邮件没及时提炼成行动（切片 3 主阶段上线前的常态，积压 38 场未归属会议属已知状态）。\n\n**新客户进来时**：客户表加一行，必填：客户名、别名（写全叫法，英文短名注意词边界）、优先级（P0/P1/P2）、关键人（五段格式）。之后该客户的邮件自动落触点、妙记自动匹配。\n\n**承诺到期未办时**：把行动行状态改成已办/已废（已废必须填废弃原因，否则进异常视图）；或改期限。\n\n**机器坏了怎么办**：三个自动化任一个连续两天没出推送，去 自动化控制台（已脱敏） 的自动化管理页看运行记录；脚本报错会写在运行日志里，按报错修脚本（都在 `（脚本目录已脱敏）/`）。\n\n## 十、下一步建议（接手人路线图）\n\n1. **切片 3 主阶段**（优先级最高）：从 47 场「未提炼」会议中抽行动草案 + 待裁决卡，把会议表「提炼状态」推进到「已确认」。这是系统从「素材库」升级为「承诺提炼机」的关键一步。\n2. **切片 5**：公式/聚合字段（兑现率、沉默天数）+ 降级机器写 max()，同时解决「阶段停滞」「本周新增」两个缺口。\n3. **数据回填**：6 家客户的「最后触点日」历史回填（需用户点头才做，机器只写机器字段的例外需明示授权）。\n4. **「客户A（惯称）」别名确认**：一句话的事，用户确认后 3 场会议自动归位。\n";
