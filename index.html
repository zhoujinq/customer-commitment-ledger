览](https://zhoujinq.github.io/customer-commitment-ledger/#overview)\n- [客户全景](https://zhoujinq.github.io/customer-commitment-ledger/#customers)\n- [跟进待办](https://zhoujinq.github.io/customer-commitment-ledger/#actions)\n- [沟通记录](https://zhoujinq.github.io/customer-commitment-ledger/#touchpoints)\n- [会议素材](https://zhoujinq.github.io/customer-commitment-ledger/#meetings)\n- [自动化说明](https://zhoujinq.github.io/customer-commitment-ledger/#automation)\n- [项目说明](https://zhoujinq.github.io/customer-commitment-ledger/#docs)\n\n> 在线页面与仓库中的 `index.html` 使用同一套静态代码。页面展示固定日期的虚构客户快照，不读取真实客户数据，不发送消息，也不执行自动化任务。\n\n## 为什么做这个项目\n\n客户跟进的信息往往散落在邮件、会议纪要、聊天记录和个人待办中：\n\n- 客户处于哪个阶段，要靠翻记录还原；\n- 最近一次沟通是什么，缺少统一时间线；\n- 下一步做什么、什么时候到期，容易漏掉；\n- 为什么留下这项待办，找不到原始出处；\n- 每周复盘时，难以同时看清推进、逾期与素材积压。\n\n本系统把这些碎片整理为可管理的数据行：**客户是谁、处于什么阶段、最近沟通了什么、下一步由谁跟进、依据在哪里。**\n\n一句话概括：\n\n> **邮件和会议进来，客户状态和下一步行动出去。**\n\n## 核心业务闭环\n\n| 环节 | 要解决的问题 | 系统做法 |\n| --- | --- | --- |\n| 捕捉 | 原始素材散落 | 新邮件形成触点记录，会议转写形成会议记录 |\n| 整理 | 客户状态难以还原 | 将客户、会议和触点按统一身份归档 |\n| 跟进 | 到期与逾期缺少提醒 | 从素材中整理待办，保留期限、责任方和出处 |\n| 复盘 | 推进与积压不可见 | 每周汇总事项变动、逾期、积压和完成情况 |\n\n### 三条无人值守硬规则\n\n1. **机器只写机器字段**：今日分、最后触点日、触点和会议行可以由自动化写入；卡点、优先级、阶段和客户归属只能由人确认。\n2. **不自动确认待裁决项**：自动抽取结果必须经人工确认，不能把模型草案直接当作事实。\n3. **失败即停，重试不超过 2 次**：避免无人值守任务无限重试、刷屏或放大异常。\n\n## 工作台功能\n\n工作台包含七个完整视图。桌面端通过固定侧栏切换，手机端通过菜单打开同一套导航；每个视图也可以通过 URL hash 直接访问。侧栏底部保留“3 个自动化运行中”的原系统快照状态，并明确公开页面不执行真实任务。\n\n| 视图 | 主要内容 | 交互能力 |\n| --- | --- | --- |\n| 总览 | 今日优先事项、全部跟进、自动化、业务闭环和客户全景 | 完整展开现有 8 条行动，直接进入各业务视图 |\n| 客户全景 | 6 家虚构客户的优先级、阶段、类型、最近触点与待办 | 搜索客户，按优先级或阶段筛选，展开别名与卡点 |\n| 跟进待办 | 8 条行动及其期限、状态、责任方与出处 | 搜索，按待办、逾期、无期限、已办筛选，展开出处 |\n| 沟通记录 | 17 条邮件触点及客户归属状态 | 搜索主题或备注，按客户与来源筛选 |\n| 会议素材 | 47 场会议的日期、归属与整理状态 | 搜索标题，按客户与状态筛选 |\n| 自动化 | A2、A3、A4 三个核心自动化配置 | 查看运行快照、触发方式、处理逻辑、边界和已知缺口 |\n| 项目说明 | 项目原理、功能、数据边界、维护方式与路线图 | 阅读本 README，下载 Markdown，访问仓库 |\n\n总览不再用一行“查看全部跟进记录”的入口代替工作内容，而是直接呈现全部现有行动、3 个自动化、4 步业务闭环和 6 家客户的完整表格。\n\n### 阅读与显示设置\n\n点击页面底部的 **“显示设置”**，可以切换标准或紧凑行密度，也可以恢复默认显示。\n\n页面提供跳到主要内容的链接、清晰键盘焦点、当前视图标识、减少动态效果支持、移动端抽屉导航和表格局部滚动。\n\n## 导航与快捷操作\n\n- **侧栏直达**：七个视图始终保留入口，并显示客户、逾期、会议、触点和自动化等关键数量。\n- **总览完整阅读**：今日优先事项用于快速判断，下方完整清单用于逐条检查待办、已办和出处。\n- **业务视图筛选**：客户、行动、触点和会议支持搜索与组合筛选；中文输入法组合输入不会被打断。\n- **移动端菜单**：窄屏下从“菜单”打开工作台侧栏，选择视图后自动收起，也可点击遮罩或按 Esc 关闭。\n- **可分享深链接**：直接访问 `#overview`、`#customers`、`#actions`、`#touchpoints`、`#meetings`、`#automation` 或 `#docs` 即可打开对应视图。\n\n## 当前演示快照\n\n数据日期：**2026-11-18**。\n\n| 指标 | 数量 | 说明 |\n| --- | ---: | --- |\n| 客户 | 6 | 客户A–F，全部为虚构代号 |\n| 跟进事项 | 8 | 5 条待办，其中 2 条逾期、3 条无期限；另有 3 条已办 |\n| 会议 | 47 | 38 场未归属，主整理阶段尚未建设 |\n| 邮件触点 | 17 | 7 条已归属、10 条未归属 |\n| 数据表 | 4 | 客户、行动、会议、触点 |\n| 业务视图 | 8 | 今天、风险雷达、客户全景及 5 个异常视图 |\n| 核心自动化配置 | 3 | A2 邮件触点、A3 每日跟进提醒、A4 周复盘 |\n\n这些数字用于呈现系统业务结构与管理口径；身份、联系方式、单号和外部资源标识均不公开。\n\n## 自动化设计\n\n> 本仓库展示自动化的产品设计与静态配置，不包含真实定时任务、消息发送能力或生产环境脚本。\n\n| 配置 | 触发方式 | 处理逻辑 | 输出 |\n| --- | --- | --- | --- |\n| A2 新邮件触点落表 | 收到新邮件 | 依次按关键人邮箱、邮箱域名匹配；无法识别则进入未归属；以来源 ID 幂等 | 触点记录、最后触点日 |\n| A3 每日跟进提醒 | 每天 08:30 | 计算今日分，按逾期与真实约定排序；同一客户在 Top 2 中最多占一条 | 每日优先事项及数据健康指标 |\n| A4 周复盘 | 每周六 14:30 | 只读汇总本周事项变动、逾期 Top 3、素材积压和完成情况 | 每周复盘摘要 |\n\n### 今日分\n\n公开快照采用的排序口径为：\n\n```text\n今日分 = 逾期天数 × 3 + 真实约定加权 15\n```\n\n今日分只用于确定提醒顺序，不替代人工判断，也不表示客户价值。\n\n## 数据结构\n\n### 四张核心表\n\n| 数据表 | 关键字段 | 作用 |\n| --- | --- | --- |\n| 客户 | 客户名、别名、优先级、阶段、卡点、关键人、最后触点日、归属 | 待办与触点的归集对象 |\n| 行动 | 内容、客户、状态、期限、期限性质、来源、责任方、阻塞项、出处、今日分 | 跟进事项的最小管理单元 |\n| 会议 | 标题、会议标识、日期、客户、整理状态、摘要 | 行动整理的上游素材 |\n| 触点 | 主题、客户、日期、来源、来源 ID、备注 | 证明客户近期往来的轻量流水 |\n\n### 八个业务视图\n\n- 今天：待办且今日分非空，按今日分降序；\n- 风险雷达：待办且期限早于今天，按期限升序；\n- 客户全景：按 P0 → P2 分组；\n- 异常·卡点为空；\n- 异常·已废无原因；\n- 异常·期限缺失；\n- 异常·会议未归属；\n- 异常·触点未归属。\n\n## 本地运行\n\n### 方式一：直接打开\n\n1. 下载或克隆仓库：\n\n   ```bash\n   git clone https://github.com/zhoujinq/customer-commitment-ledger.git\n   ```\n\n2. 进入项目目录，使用浏览器打开 `index.html`。\n\n不需要执行 `npm install`，也不需要构建工具、账号或 API Key。运行所需字体和业务代码均在本地，直接打开即可离线浏览。\n\n### 方式二：本地静态服务器\n\n如果希望通过 HTTP 访问，可在项目目录执行：\n\n```bash\npython -m http.server 8000\n```\n\n然后访问 `http://localhost:8000/`。\n\n### GitHub Pages\n\n本项目适合直接使用 GitHub Pages 发布仓库根目录：\n\n1. 打开仓库的 **Settings → Pages**；\n2. 选择从分支部署；\n3. 选择主分支与 `/(root)`；\n4. 保存后访问本 README 顶部的在线预览地址。\n\n## 技术实现\n\n- **单文件应用**：页面结构、样式、原生 JavaScript、业务数据和公开项目说明均包含在 `index.html` 中；\n- **无框架、无构建依赖**：不需要 React、Node.js、包管理器或编译步骤；\n- **本地字体**：Maple Mono 与 Noto Sans SC 随仓库提供，不依赖外部字体 CDN；\n- **数据入口集中**：演示快照位于 `window.CRM_DATA`，公开项目说明位于 `window.PROJECT_README`；\n- **可分享导航**：七个视图支持 URL hash 深链接，以及浏览器前进、后退；\n- **响应式布局**：宽表格只在自身容器内滚动，不撑破页面；\n- **离线可用**：页面没有真实数据请求，也没有外部服务依赖；\n- **可编辑介绍卡片**：`assets/project-card.html` 是卡片源文件，`assets/project-card.png` 是 README 使用的同尺寸导出图。\n\n## 项目结构\n\n```text\nproject/\n├── index.html                 # 交互式工作台主文件\n├── README.md                  # 完整项目说明\n└── assets/\n    ├── project-card.html      # 1280×640 项目介绍卡片源文件\n    ├── project-card.png       # 项目介绍卡片导出图\n    └── fonts/\n        ├── maple-regular.woff2\n        ├── maple-bold.woff2\n        ├── noto-sans-sc-*.woff2\n        └── LICENSE-*.txt      # 字体许可证\n```\n\n## 数据与隐私边界\n\n公开仓库遵循以下边界：\n\n- 客户仅使用客户A–F等虚构代号，联系人也使用代号；\n- 不包含内部人员姓名、内部邮箱、手机号、真实客户名或真实客户别名；\n- 不包含内部平台链接、数据底座地址、资源 token、物流单号或 SN 码；\n- Astribot、T1、S1 等公开产品线信息可以保留；\n- 数量、日期、逾期天数等快照口径可以保留，但不能据此反推出真实身份；\n- 页面不连接真实数据底座，不发送消息，不运行真实自动化；\n- 真实系统与公开演示分叉维护，不进行自动同步。\n\n**请勿通过 Issue、Pull Request、提交记录或附件向仓库补充任何真实业务数据。**\n\n## 维护与更新\n\n从真实系统更新公开快照时，建议按以下顺序操作：\n\n1. 从真实系统导出最新快照；\n2. 在公开仓库之外完成身份替换与资源标识清理；\n3. 替换 `index.html` 中的 `window.CRM_DATA`；\n4. 同步更新 `README.md` 与页面内的 `window.PROJECT_README`；\n5. 检查客户、行动、会议和触点数量是否一致；\n6. 扫描真实客户名、内部人名、邮箱、手机号、单号、token 和内部平台链接；\n7. 检查所有本地字体与资源引用；\n8. 在浏览器验证七个视图、移动导航、搜索筛选、详情展开、文档下载和完整记录呈现；\n9. 确认公开仓库、提交说明、README 和介绍卡片均不含敏感信息后再发布。\n\n新增文案时，如果希望继续保持一致的字体表现，应同时检查字体子集的字符覆盖；必要时重新生成对应 WOFF2 文件。\n\n## 后续路线\n\n真实系统与公开演示可以共享产品思路，但分别维护。后续建设重点包括：\n\n1. **会议整理主阶段**：从会议素材生成行动草案与待裁决卡，人工确认后进入跟进待办；\n2. **聚合与公式能力**：补充完成率、沉默天数等指标，并完善降级写入策略；\n3. **历史数据回填**：在明确授权后补齐客户历史最后触点日；\n4. **异常治理能力**：继续完善期限缺失、未归属、卡点为空和已废无原因等异常视图；\n5. **公开演示体验**：在不引入真实业务数据的前提下，持续改进可访问性、交互和说明文档。\n\n## 字体许可\n\n项目运行使用以下字体，并保留对应许可证：\n\n- Maple Mono；\n- Noto Sans SC。\n\n上述字体均按 **SIL Open Font License 1.1** 使用，许可证位于 [`assets/fonts/`](assets/fonts/)。\n";</script>
<script>
(() => {
  "use strict";
  const D = window.CRM_DATA;
  const README = window.PROJECT_README;
  const PRODUCT = "销售助手-客户管理系统";
  const VIEWS = [
    {id:"overview",label:"总览",desc:"今日事项、全部跟进、自动化和客户全景的工作快照。"},
    {id:"customers",label:"客户全景",desc:"按优先级与阶段查看客户，并展开别名、卡点和关联待办。"},
    {id:"actions",label:"跟进待办",desc:"每条行动都有状态、期限、责任边界和可展开的出处。"},
    {id:"touchpoints",label:"沟通记录",desc:"邮件触点按客户归集，未归属记录单独可见。"},
    {id:"meetings",label:"会议素材",desc:"搜索会议标题，检查客户归属与整理状态。"},
    {id:"automation",label:"自动化",desc:"原系统三项自动化的触发方式、处理逻辑与运行边界。"},
    {id:"docs",label:"项目说明",desc:"完整阅读项目说明，或下载 README.md。"}
  ];
  const state = {
    view:"overview",
    customers:{q:"",priority:"",stage:""},
    actions:{q:"",status:"",customer:""},
    touchpoints:{q:"",customer:"",source:""},
    meetings:{q:"",customer:"",status:""}
  };
  const $ = (selector,root=document) => root.querySelector(selector);
  const $$ = (selector,root=document) => [...root.querySelectorAll(selector)];
  const esc = value => String(value ?? "").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
  const list = value => Array.isArray(value) ? value : [];
  const unique = values => [...new Set(values.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b),"zh-CN"));
  const textMatch = (query,values) => !query || values.join(" ").toLowerCase().includes(query.trim().toLowerCase());
  const date = value => value || "未设置";
  const isDone = action => action.status === "已办";
  const isOverdue = action => action.status === "待办" && Number(action.overdue_days) > 0;
  const hasNoDate = action => action.status === "待办" && !action.deadline;
  const score = action => Number(action.overdue_days || 0) * 3 + (action.nature === "真实约定" ? 15 : 0);
  const byCustomer = name => D.actions.filter(action=>action.customer===name && action.status==="待办");
  const viewMeta = id => VIEWS.find(view=>view.id===id) || VIEWS[0];
  const option = (value,current,label) => `<option value="${esc(value)}"${String(value)===String(current)?" selected":""}>${esc(label ?? value)}</option>`;
  const empty = (title="没有匹配记录",hint="调整搜索词或清除筛选后再看。") => `<div class="empty"><strong>${esc(title)}</strong>${esc(hint)}</div>`;
  const countText = (shown,total) => `显示 ${shown} / ${total} 条`;
  const statusBadge = status => `<span class="badge ${status==="已办"?"done":status==="待办"?"todo":"neutral"}">${esc(status || "未设置")}</span>`;
  const priorityBadge = priority => `<span class="badge ${String(priority).toLowerCase()}">${esc(priority || "未分级")}</span>`;

  function go(id){
    const target = viewMeta(id).id;
    if(location.hash === `#${target}`){ state.view=target; render(); }
    else location.hash = target;
  }

  function renderTabs(){
    const meta = {
      overview:`${D.customers.length} 客户`,
      customers:`P0 × ${D.customers.filter(customer=>customer.priority==="P0").length}`,
      actions:`逾期 ${D.actions.filter(isOverdue).length}`,
      touchpoints:String(D.touchpoints.length),
      meetings:String(D.meetings.length),
      automation:`${D.automations.filter(auto=>auto.enabled).length} 运行`,
      docs:"文档"
    };
    $("#view-tabs").innerHTML = VIEWS.map(view=>`<a class="side-nav-link" href="#${view.id}" data-route="${view.id}" aria-current="${state.view===view.id?"page":"false"}"><span>${view.label}</span><small>${esc(meta[view.id])}</small></a>`).join("");
  }

  function actionRow(action){
    const overdue = isOverdue(action);
    return `<article class="ledger-row">
      <div class="ledger-top">
        <div>${statusBadge(action.status)}</div>
        <div class="priority-customer">${esc(action.customer)}</div>
        <div><div class="ledger-title">${esc(action.content)}</div><div class="ledger-meta">责任方 ${esc(action.promiser || "未设置")} · 来源 ${esc(action.source || "未设置")}${action.blocker?` · 阻塞 ${esc(action.blocker)}`:""}${action.status==="待办"?` · 今日分 ${score(action)}`:""}</div></div>
        <div class="ledger-date ${overdue?"overdue":""}">${esc(date(action.deadline))}${overdue?`<br>逾期 ${Number(action.overdue_days)} 天`:hasNoDate(action)?"<br>无期限":""}</div>
      </div>
      <details class="evidence"><summary>查看出处</summary><p>${esc(action.evidence || "这条记录没有出处说明。")}</p></details>
    </article>`;
  }

  function renderOverview(){
    const todos = D.actions.filter(action=>action.status==="待办");
    const priorities = [...todos].sort((a,b)=>(isOverdue(b)-isOverdue(a)) || (Number(b.overdue_days||0)-Number(a.overdue_days||0)) || score(b)-score(a));
    const top = priorities.slice(0,2);
    const orderedActions = [...D.actions].sort((a,b)=>(isDone(a)-isDone(b)) || (isOverdue(b)-isOverdue(a)) || score(b)-score(a));
    const unassignedMeetings = D.meetings.filter(item=>item.customer==="未归属").length;
    const unassignedTouches = D.touchpoints.filter(item=>item.customer==="未归属").length;
    const running = D.automations.filter(auto=>auto.enabled).length;
    const maxScore = Math.max(...top.map(score),1);

  function filterBar(view,fields){

      status:{type:"select",label:"状态",options:view==="actions"?[["","全部状态"],["待办","待办"],["overdue","逾期"],["nodate","无期限"],["已办","已办"]]:view==="meetings"?["",...unique(D.meetings.map(m=>m.status))]:[]},
      customer:{type:"select",label:"客户",options:["",...unique([...D.customers.map(c=>c.name),"未归属"])]},
      source:{type:"select",label:"来源",options:["",...unique(D.touchpoints.map(t=>t.source))]}
    };
    return `<div class="table-tools">${fields.map(key=>{
      const item=config[key], value=state[view][key], id=`filter-${key}`;
      if(item.type==="input") return `<label class="search-box" for="${id}"><span>${item.label}</span><input class="input" id="${id}" data-filter="${key}" value="${esc(value)}" placeholder="${item.placeholder}" type="search"></label>`;
      const options=item.options.map(entry=>Array.isArray(entry)?option(entry[0],value,entry[1]):option(entry,value,entry===""?`全部${item.label}`:entry)).join("");
      return `<label for="${id}"><span>${item.label}</span><select id="${id}" data-filter="${key}">${options}</select></label>`;
    }).join("")}</div>`;
  }

  function wireFilters(view){
    $$('[data-filter]',$("#view")).forEach(control=>{
      const isInput=control.tagName==="INPUT";
      let timer=null,composing=false;
      const update=()=>{
        const position=control.selectionStart;
        state[view][control.dataset.filter]=control.value;
        render();
        if(isInput){
          const next=$(`#${control.id}`);
          next.focus();
          try{next.setSelectionRange(position,position)}catch{}
        }
      };
      const schedule=()=>{
        clearTimeout(timer);
        if(!composing) timer=setTimeout(update,180);
      };
      if(isInput){
        control.addEventListener("compositionstart",()=>{composing=true;clearTimeout(timer)});
        control.addEventListener("compositionend",()=>{composing=false;schedule()});
        control.addEventListener("input",schedule);
      }else control.addEventListener("change",update);
    });
    const clear=$("[data-clear-filters]",$("#view"));
    if(clear) clear.addEventListener("click",()=>{Object.keys(state[view]).forEach(key=>state[view][key]="");render()});
  }

  function inlineMarkdown(text){
    let value=esc(text);
    value=value.replace(/`([^`]+)`/g,"<code>$1</code>");
    value=value.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    value=value.replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+|#[^\s)]+|assets\/[^\s)]+)\)/g,(match,label,url)=>`<a href="${url}"${url.startsWith("http")?' target="_blank" rel="noopener noreferrer"':""}>${label}</a>`);
    return value;
  }

  function markdownToHtml(markdown){
    const lines=markdown.replace(/\r/g,"").split("\n");
    const html=[],toc=[];
    let index=0,headingIndex=0;
    const cells=line=>line.trim().replace(/^\||\|$/g,"").split("|").map(cell=>cell.trim());
    while(index<lines.length){
      const line=lines[index],trim=line.trim();
      if(!trim){index++;continue}
      if(trim.startsWith("```")){
        const code=[];index++;
        while(index<lines.length&&!lines[index].trim().startsWith("```")){code.push(lines[index]);index++}
        index++;html.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`);continue;
      }
      const image=trim.match(/^!\[([^\]]*)\]\((assets\/[^)]+)\)$/);
      if(image){html.push(`<img src="${esc(image[2])}" alt="${esc(image[1])}">`);index++;continue}
      const heading=trim.match(/^(#{1,3})\s+(.+)$/);
      if(heading){const level=heading[1].length,id=`doc-heading-${headingIndex++}`;if(level===2)toc.push({id,label:heading[2]});html.push(`<h${level} id="${id}">${inlineMarkdown(heading[2])}</h${level}>`);index++;continue}
      if(/^---+$/.test(trim)){html.push("<hr>");index++;continue}
      if(trim.startsWith(">")){
        const quote=[];while(index<lines.length&&lines[index].trim().startsWith(">")){quote.push(lines[index].trim().replace(/^>\s?/,""));index++}html.push(`<blockquote><p>${inlineMarkdown(quote.join(" "))}</p></blockquote>`);continue;
      }
      if(trim.startsWith("|")&&index+1<lines.length&&/^\s*\|?[\s:|-]+\|?\s*$/.test(lines[index+1])&&lines[index+1].includes("-")){
        const headers=cells(trim);index+=2;const rows=[];while(index<lines.length&&lines[index].trim().startsWith("|")){rows.push(cells(lines[index]));index++}
        html.push(`<div class="table-scroll"><table><thead><tr>${headers.map(cell=>`<th>${inlineMarkdown(cell)}</th>`).join("")}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${inlineMarkdown(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);continue;
      }
      if(/^[-*]\s+/.test(trim)){
        const items=[];while(index<lines.length&&/^[-*]\s+/.test(lines[index].trim())){items.push(lines[index].trim().replace(/^[-*]\s+/,""));index++}html.push(`<ul>${items.map(item=>`<li>${inlineMarkdown(item)}</li>`).join("")}</ul>`);continue;
      }
      if(/^\d+\.\s+/.test(trim)){
        const items=[];while(index<lines.length&&/^\d+\.\s+/.test(lines[index].trim())){items.push(lines[index].trim().replace(/^\d+\.\s+/,""));index++}html.push(`<ol>${items.map(item=>`<li>${inlineMarkdown(item)}</li>`).join("")}</ol>`);continue;
      }
      const paragraph=[trim];index++;
      while(index<lines.length&&lines[index].trim()&&!/^(#{1,3})\s+|^```|^>|^[-*]\s+|^\d+\.\s+|^---+$/.test(lines[index].trim())){paragraph.push(lines[index].trim());index++}
      html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
    }
    return {html:html.join(""),toc};
  }
